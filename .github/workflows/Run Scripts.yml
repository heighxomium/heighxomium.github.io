name: Run Scripts

on:
  workflow_dispatch:
    inputs:
      group1:
        description: "Linkvertise"
        type: boolean
        default: false
      group2:
        description: "AdBlock Plus"
        type: boolean
        default: false
      group3:
        description: "Iron Fox rebranding"
        type: boolean
        default: false
      debug:
        description: "Debug (skip commit & release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies from requirements.txt
        run: pip install -r scripts/assets/requirements.txt

      - name: Group 1 (Linkvertise)
        if: ${{ inputs.group1 }}
        run: |
          python scripts/python.001.py
          python scripts/python.002.py
          python scripts/python.003.py
          python scripts/python.004.py

      - name: Group 2 (AdBlock Plus)
        if: ${{ inputs.group2 }}
        run: python scripts/python.005.py

      - name: Group 3 (Iron Fox rebranding)
        if: ${{ inputs.group3 }}
        run: python scripts/python.006.py

      # Updated: Latest configuration based on official documentation
      - name: Upload APKs to Release
        if: ${{ inputs.group3 && !inputs.debug }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
          release_name: "Iron Fox APKs (latest beta)"
          file: scripts/assets/generated/python.006/*.apk
          file_glob: true
          overwrite: true
          prerelease: false
          make_latest: true
          check_duplicates: false
          body: |
            ## Generated artifacts uploaded directly for testing purposes.
            
            This is unofficial files, try at your own risk.

      - name: Commit filter files
        if: ${{ !inputs.debug && (inputs.group1 || inputs.group2) }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update filter lists"
          file_pattern: "scripts/assets/generated/*.txt"
          branch: main
