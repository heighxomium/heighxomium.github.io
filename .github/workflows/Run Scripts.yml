name: Run Scripts

on:
  workflow_dispatch:
    inputs:
      run_group_1:
        description: "Linkvertise (Python 1–4)"
        type: boolean
        default: false
      run_group_2:
        description: "AdBlock Plus (Python 5)"
        type: boolean
        default: false
      debug_mode:
        description: "Debug"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Group 1 (Scripts 1–4)
        if: ${{ inputs.run_group_1 }}
        run: |
          python scripts/python.001.py
          python scripts/python.002.py
          python scripts/python.003.py
          python scripts/python.004.py

      - name: Run Group 2 (Script 5)
        if: ${{ inputs.run_group_2 }}
        run: |
          python scripts/python.005.py

      - name: Commit and push generated files
        if: ${{ !inputs.debug_mode }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update generated filter files"
          file_pattern: "scripts/generated/*"
          branch: main
