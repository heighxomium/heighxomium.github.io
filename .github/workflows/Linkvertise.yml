name: Linkvertise

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL Link'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install py7zr pillow requests

      - name: Create downloads folder and list directory
        run: mkdir -p downloads/list

      - name: Clear previous outputs (idempotent)
        run: |
          find downloads -mindepth 1 -not -path "downloads/list*" -delete
          > downloads/list/list.txt

      - name: Download file from URL
        run: python scripts/python.001.py "${{ inputs.url }}"

      - name: Compress media files
        run: python scripts/python.002.py

      - name: Archive files
        run: python scripts/python.003.py

      - name: Upload to EasySend
        run: python scripts/python.004.py

      - name: Commit and push list.txt to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/list/list.txt
          if git diff --cached --quiet; then
            echo "No changes to list.txt, skipping commit"
          else
            git commit -m "Update share links [skip ci]"
            git push
          fi
