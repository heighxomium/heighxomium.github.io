name: Stamp Last Modified Date

on:
  push:
    paths:
      - 'pages/_collections/_linkvertise/*.md'
    branches:
      - main

jobs:
  update-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          git diff --name-only HEAD^ HEAD -- 'pages/_collections/_linkvertise/*.md' > changed.txt
          cat changed.txt

      - name: Insert last commit date into front matter
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            COMMIT_DATE=$(git log -1 --format=%cI -- "$file")
            if grep -q '^last_modified_at:' "$file"; then
              sed -i "s/^last_modified_at:.*/last_modified_at: $COMMIT_DATE/" "$file"
            else
              sed -i "1s/^---/---\nlast_modified_at: $COMMIT_DATE/" "$file"
            fi
          done < changed.txt

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update last_modified_at [skip ci]"
          file_pattern: 'pages/_collections/_linkvertise/*.md'
          skip_ci: true
