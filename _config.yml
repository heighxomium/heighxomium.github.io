remote_theme: dieghernan/chulapa

title: Heighxomium
subtitle: Private Website

navbar:
  style: "classic"
  brand:
    title: Heighxomium
    img: "https://avatars.githubusercontent.com/u/280498728"
  nav:
  - title: Home
    url: /index
  - title: Posts
    child:
     - title: Posts
       url: /pages/index.pages/linkvertise

footer:
  links:
    - label : Facebook
      icon  : fab fa-facebook
      url   : https://fb.me/ultimatinium
    - label : GitHub
      icon  : fab fa-github
      url   : https://github.com/Heighxomium
    - label : Proton Mail
      icon  : fa fa-envelope
      url   : ph.server@pm.me
  copyright: © 2022 by SCPF-Bot

googlefonts:
 - url: https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap
chulapa-skin: 
  skin: gitdev-dark
  vars:
    font-family-base: "Ubuntu Mono"
comments:
  provider: giscus #https://giscus.app
  #provider: welcomments
  #website_id: "JmOHDoyWDZURoAoxETF4oNUl2"
  #provider: disqus #https://disqus.com
  #disqus_shortname: scpf-archive

collections_dir     : pages/_collections
collections:
  linkvertise:
    output: true
    permalink: /linkvertise/:name

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      include_on_search : false
      show_comments     : false
      show_date         : false
  -
    scope:
      path: "pages/_collections/_linkvertise"
    values:
      header_type       : "hero"
      header_img        : assets/images/main.001.jpeg
      show_comments     : true
      show_date         : true

### MISCELLANEOUS ###
compress_html:
  clippings: all
  blanklines: true
plugins:
  - jekyll-github-metadata
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-sitemap
exclude:
  - LICENSE
  - Gemfile
  - vendor
  - readme
markdown: kramdown
highlighter: github
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: '&uarr;'
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
sass:
  sass_dir: _sass
  style: compressed
