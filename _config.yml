remote_theme: dieghernan/chulapa

title: Heighxomium
subtitle: Private Website

author:
  name                  :      Heighxomium
  avatar                :      https://avatars.githubusercontent.com/u/280498728
  location              :      SCP Foundation (Site-19)
  links:                
    - url: https://fb.me/june.12th.2019
      icon: "fab fa-facebook"
    - url: https://github.com/SCPF-Bot
      icon: "fab fa-github"
    - url: ph.server@pm.me
      icon: "fa fa-envelope"

navbar:
  style: "classic"
  brand:
    title: Heighxomium
    img: "https://avatars.githubusercontent.com/u/280498728"
  nav:
  - title: Home
    url: /index
  - title: Special Thanks
    url: /pages/misc/special.thanks

chulapa-skin: 
  skin: gitdev-dark
  vars:
    font-family-base: "Ubuntu Mono"

comments:
  provider: giscus #https://giscus.app
  #provider: welcomments
  #website_id: "JmOHDoyWDZURoAoxETF4oNUl2"
  #provider: disqus #https://disqus.com
  #disqus_shortname: scpf-archive

collections_dir: pages/_collections
collections:
  posts:
    output: true
    permalink: /:collection/:name/

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      include_on_search : false
      show_comments     : true
      show_date         : false

  -
    scope:
      path: "pages/collections/posts"
    values:
      header_type       : "hero"
      header_img        : assets/images/main.001.jpeg
      show_comments     : false
      show_date         : false
      show_bottomnavs   : true

# Miscellaneous options.
compress_html:
  clippings: all
  blanklines: true

plugins:
  - jekyll-github-metadata
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-sitemap

exclude:
  - LICENSE
  - Gemfile
  - vendor
  - readme

markdown: kramdown
highlighter: github
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: '&uarr;'
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed
