remote_theme: dieghernan/chulapa

title: Heighxomium
subtitle: Private Website

author:
  name      : Heighxomium
  avatar    : https://avatars.githubusercontent.com/u/280498728
  location  : SCP Foundation (Site-19)
  links:
    - url: https://fb.me/june.12th.2019
      icon: "fab fa-facebook"
    - url: https://github.com/SCPF-Bot
      icon: "fab fa-github"
    - url: ph.server@pm.me
      icon: "fa fa-envelope"

navbar:
  style: "classic"
  brand:
    title: Heighxomium
    img: "https://avatars.githubusercontent.com/u/280498728"
  nav:
    - title: Home
      url: /index
    - title: Blog
      url: /pages/index.pages/posts/          # 👈 blog index page
    - title: Special Thanks
      url: /pages/misc/special.thanks

chulapa-skin:
  skin: gitdev-dark
  vars:
    font-family-base: "Ubuntu Mono"

comments:
  provider: giscus
  # provider: welcomments  # (commented out)
  # website_id: "JmOHDoyWDZURoAoxETF4oNUl2"
  # provider: disqus
  # disqus_shortname: scpf-archive

# Pagination (for the blog index)
paginate: 5
paginate_path: /pages/index.pages/posts/page:num/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      include_on_search: false
      show_comments: true
      show_date: false

  - scope:
      path: "_posts"                          # 👈 standard Jekyll posts folder
    values:
      layout: "post"                          # use theme's post layout
      header_type: "hero"
      header_img: /assets/images/main.001.jpeg
      show_comments: true
      show_date: true
      show_bottomnavs: true

# Miscellaneous
compress_html:
  clippings: all
  blanklines: true

plugins:
  - jekyll-github-metadata
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-sitemap

exclude:
  - LICENSE
  - Gemfile
  - vendor
  - readme

markdown: kramdown
highlighter: github
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: '&uarr;'
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed
