---
layout: default
---
<div class="container py-4">
  <div class="row">
    <div class="col-12">
      <h1 class="mb-4">Linkvertise Posts</h1>

      <!-- Posts will be injected here -->
      <div id="posts-container">
        <div class="text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading…</span>
          </div>
        </div>
      </div>

      <!-- Load More Button -->
      <div id="loadmore-container" class="text-center mt-4">
        <button id="loadmore-btn" class="btn btn-primary">Load more posts</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Configuration
  const POSTS_PER_PAGE = 10;
  let currentPage = 1;
  let allPosts = [];
  let isLoading = false;

  // Fetch posts from /scripts/all.posts.json
  fetch('/scripts/all.posts.json')
    .then(response => {
      if (!response.ok) throw new Error('Network response was not ok');
      return response.json();
    })
    .then(data => {
      allPosts = data;
      // Remove loading spinner
      const container = document.getElementById('posts-container');
      container.innerHTML = '';
      // Load the first batch
      loadMorePosts();
    })
    .catch(error => {
      console.error('Error loading posts:', error);
      document.getElementById('posts-container').innerHTML = `
        <div class="alert alert-danger">
          Failed to load posts. Please refresh the page.
        </div>
      `;
      document.getElementById('loadmore-container').style.display = 'none';
    });

  function loadMorePosts() {
    if (isLoading) return;
    isLoading = true;

    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const end = start + POSTS_PER_PAGE;
    const postsToLoad = allPosts.slice(start, end);

    if (postsToLoad.length === 0) {
      // No more posts – disable button
      const btn = document.getElementById('loadmore-btn');
      btn.disabled = true;
      btn.innerText = "All posts loaded";
      isLoading = false;
      return;
    }

    const container = document.getElementById('posts-container');

    postsToLoad.forEach(post => {
      const article = document.createElement('article');
      article.className = 'mb-4 loadmore-item';
      article.innerHTML = `
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">${escapeHtml(post.title)}</h5>
            <h6 class="card-subtitle mb-2 text-muted">${escapeHtml(post.date)}</h6>
            <p class="card-text">${escapeHtml(post.excerpt)}</p>
            <a href="${escapeHtml(post.url)}" class="card-link">Continue reading →</a>
          </div>
        </div>
      `;
      container.appendChild(article);
    });

    currentPage++;
    isLoading = false;
  }

  // Helper function to prevent XSS
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Attach event listener to Load More button
  document.getElementById('loadmore-btn').addEventListener('click', loadMorePosts);
</script>

<style>
  .loadmore-item {
    transition: all 0.2s ease;
  }
  #loadmore-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .spinner-border {
    width: 3rem;
    height: 3rem;
  }
</style>
