---
layout: default
---
{{ content }}

<div class="container px-lg-3">
  <div id="posts-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-2 g-4">
    <div class="col-12 text-center py-5" id="initial-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading posts…</span>
      </div>
    </div>
  </div>

  <div id="loadmore-container" class="d-flex justify-content-center mt-5 mb-5" style="display: none;">
    <button id="loadmore-btn" class="btn btn-primary btn-lg px-5 py-2 rounded-4 shadow-sm transition-transform" aria-label="Load more posts">
      <i class="fas fa-arrow-down me-2" aria-hidden="true"></i> Load more posts
      <i class="fas fa-spinner fa-pulse d-none ms-2" id="loadmore-spinner" aria-hidden="true"></i>
    </button>
  </div>
</div>

<template id="card-template">
  <div class="col mb-4 card-col">
    <div class="card chulapa-border-card-index rounded-4 shadow-sm h-100 position-relative overflow-hidden hover-lift">
      <div class="chulapa-min-h-10 chulapa-card-img chulapa-overlay-img" style="background-size: cover; background-position: center;" aria-label="Post thumbnail"></div>
      <div class="card-body d-flex flex-column flex-grow-1 overflow-auto position-relative">
        <article class="flex-grow-1">
          <a href="#" class="stretched-link title-link text-decoration-none"><h5 class="card-title fw-bold mb-2"></h5></a>
          <h6 class="card-subtitle mb-2 text-muted subtitle"></h6>
          <div class="card-text mb-3 excerpt text-secondary small"></div>
        </article>
        <div class="border-top pt-3 mt-auto">
          <p class="small text-end fst-italic mb-2 date"></p>
          <div class="categories-badges mb-2"></div>
          <div class="tags-badges"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  (function() {
    // ----------------------------------------------------------
    // CONFIGURATION
    // ----------------------------------------------------------
    const POSTS_PER_PAGE_DESKTOP = 12;
    const POSTS_PER_PAGE_MOBILE = 10;
    const BREAKPOINT_LG = 992;

    // DOM elements
    const cardTemplate = document.getElementById('card-template');
    const container = document.getElementById('posts-container');
    const loadmoreContainer = document.getElementById('loadmore-container');
    const loadmoreBtn = document.getElementById('loadmore-btn');
    const btnSpinner = document.getElementById('loadmore-spinner');
    const initialSpinner = document.getElementById('initial-spinner');

    let currentPage = 1;
    let currentPostsPerPage = getPostsPerPage();
    let isLoading = false;

    // ----------------------------------------------------------
    // LIQUID-GENERATED POSTS DATA (SAFE JSON)
    // ----------------------------------------------------------
    let allPosts = [];
    try {
      allPosts = [
        {%- assign collection = site[page.include_collection] -%}
        {%- unless collection %}
          console.warn("indexcategory: collection '{{ page.include_collection }}' not found");
        {%- endunless -%}
        {%- assign default_img = site.default_header_image | absolute_url -%}
        {%- if page.category_name -%}
          {%- assign posts_to_show = collection | where: "categories", page.category_name -%}
        {%- elsif page.tag_name -%}
          {%- assign posts_to_show = collection | where: "tags", page.tag_name -%}
        {%- else -%}
          {%- assign posts_to_show = collection -%}
        {%- endif -%}
        {%- for post in posts_to_show -%}
          {%- capture img -%}
            {%- if post.og_image -%}{{ post.og_image | absolute_url }}
            {%- elsif post.header_img -%}{{ post.header_img | absolute_url }}
            {%- elsif default_img != "" -%}{{ default_img }}
            {%- endif -%}
          {%- endcapture -%}
          {%- assign img_clean = img | strip -%}
          {
            "title": {{ post.title | jsonify }},
            "subtitle": {{ post.subtitle | jsonify }},
            "date": {{ post.date | date: "%d/%m/%Y" | jsonify }},
            "excerpt": {{ post.excerpt | strip_html | truncatewords: 20 | jsonify }},
            "url": {{ post.url | absolute_url | jsonify }},
            "og_image": {% if img_clean != "" %}{{ img_clean | jsonify }}{% else %}null{% endif %},
            "categories": [
              {%- for cat in post.categories -%}
                { "name": {{ cat | jsonify }}, "url": {{ cat | replace: " ", "-" | prepend: "#" | prepend: post.cloudcategory_url | absolute_url | uri_escape | jsonify }} }{% unless forloop.last %},{% endunless %}
              {%- endfor -%}
            ],
            "tags": [
              {%- for tag in post.tags -%}
                { "name": {{ tag | jsonify }}, "url": {{ tag | replace: " ", "-" | prepend: "#" | prepend: post.cloudtag_url | absolute_url | uri_escape | jsonify }} }{% unless forloop.last %},{% endunless %}
              {%- endfor -%}
            ]
          }{% unless forloop.last %},{% endunless %}
        {%- endfor -%}
      ];
    } catch(e) {
      console.error("Failed to parse Liquid posts data:", e);
      allPosts = [];
    }

    const totalPosts = allPosts.length;

    // ----------------------------------------------------------
    // UTILITIES
    // ----------------------------------------------------------
    function getPostsPerPage() {
      return window.innerWidth >= BREAKPOINT_LG ? POSTS_PER_PAGE_DESKTOP : POSTS_PER_PAGE_MOBILE;
    }

    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function cssUrlEscape(url) {
      if (!url) return '';
      return url.replace(/[\\"]/g, function(m) {
        return m === '\\' ? '\\\\' : '\\"';
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function showError(message) {
      const errorDiv = document.createElement('div');
      errorDiv.className = 'col-12 text-center py-5 alert alert-danger';
      errorDiv.innerHTML = `<strong>Error loading posts:</strong> ${escapeHtml(message)}`;
      container.appendChild(errorDiv);
      if (initialSpinner) initialSpinner.remove();
    }

    function showEmptyState() {
      const emptyMsg = document.createElement('div');
      emptyMsg.className = 'col-12 text-center py-5';
      emptyMsg.innerHTML = '<p class="lead">No posts found.</p>';
      container.appendChild(emptyMsg);
      if (initialSpinner) initialSpinner.remove();
    }

    function replaceWithBackToTop() {
      if (!loadmoreContainer) return;
      loadmoreContainer.innerHTML = `
        <button id="backToTopBtn" class="btn btn-secondary btn-lg px-5 py-2 rounded-4 shadow-sm transition-transform">
          Back to top
        </button>
      `;
      const backBtn = document.getElementById('backToTopBtn');
      if (backBtn) backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    }

    // ----------------------------------------------------------
    // RENDERING
    // ----------------------------------------------------------
    function renderPost(post) {
      if (!cardTemplate) throw new Error("Card template not found");
      const clone = cardTemplate.content.cloneNode(true);
      const card = clone.querySelector('.card');
      const imageDiv = clone.querySelector('.chulapa-card-img');

      let bgImageValue;
      if (post.og_image && typeof post.og_image === 'string' && post.og_image !== 'null') {
        const escapedUrl = cssUrlEscape(post.og_image);
        bgImageValue = `url("${escapedUrl}")`;
      } else {
        bgImageValue = 'linear-gradient(135deg, #2c3e50, #3498db)';
      }
      card.style.setProperty('--card-bg-image', bgImageValue);

      if (post.og_image && typeof post.og_image === 'string' && post.og_image !== 'null') {
        imageDiv.style.backgroundImage = `url("${escapeHtml(post.og_image)}")`;
        imageDiv.classList.remove('d-none');
      } else {
        imageDiv.classList.add('d-none');
      }

      const titleLink = clone.querySelector('.title-link');
      titleLink.href = post.url;
      titleLink.querySelector('.card-title').textContent = post.title || '';

      const subtitleEl = clone.querySelector('.subtitle');
      if (post.subtitle && post.subtitle !== 'null') {
        subtitleEl.textContent = post.subtitle;
      } else {
        subtitleEl.style.display = 'none';
      }

      clone.querySelector('.excerpt').textContent = post.excerpt || '';

      const dateEl = clone.querySelector('.date');
      if (post.date && post.date !== 'null') {
        const safeDate = escapeHtml(post.date);
        dateEl.innerHTML = `<time datetime="${safeDate}"><i class="far fa-calendar-alt me-1"></i>${safeDate}</time>`;
      } else {
        dateEl.parentElement.style.display = 'none';
      }

      const catContainer = clone.querySelector('.categories-badges');
      if (post.categories && Array.isArray(post.categories)) {
        for (const cat of post.categories) {
          const badge = document.createElement('a');
          badge.href = cat.url || '#';
          badge.className = 'badge chulapa-pill-bg-secondary me-1 mb-1 z-index-2';
          badge.textContent = cat.name || '';
          catContainer.appendChild(badge);
        }
      }

      const tagContainer = clone.querySelector('.tags-badges');
      if (post.tags && Array.isArray(post.tags)) {
        for (const tag of post.tags) {
          const badge = document.createElement('a');
          badge.href = tag.url || '#';
          badge.className = 'badge chulapa-pill-bg-primary me-1 mb-1 z-index-2';
          badge.textContent = tag.name || '';
          tagContainer.appendChild(badge);
        }
      }

      return clone;
    }

    function loadMorePosts() {
      if (isLoading) return;
      isLoading = true;

      if (btnSpinner && loadmoreBtn) {
        btnSpinner.classList.remove('d-none');
        loadmoreBtn.disabled = true;
      }

      const start = (currentPage - 1) * currentPostsPerPage;
      const postsToLoad = allPosts.slice(start, start + currentPostsPerPage);

      if (postsToLoad.length === 0) {
        if (currentPage === 1 && totalPosts === 0) {
          showEmptyState();
        } else {
          replaceWithBackToTop();
        }
        isLoading = false;
        if (initialSpinner) initialSpinner.remove();
        if (loadmoreContainer) loadmoreContainer.style.display = 'none';
        return;
      }

      if (initialSpinner && currentPage === 1) {
        initialSpinner.remove();
      }

      const fragment = document.createDocumentFragment();
      for (const post of postsToLoad) {
        try {
          fragment.appendChild(renderPost(post));
        } catch (err) {
          console.error("Error rendering post:", post, err);
        }
      }
      container.appendChild(fragment);

      currentPage++;
      isLoading = false;

      if (btnSpinner) btnSpinner.classList.add('d-none');
      if (loadmoreBtn) loadmoreBtn.disabled = false;

      if (currentPage * currentPostsPerPage >= totalPosts) {
        replaceWithBackToTop();
      }
    }

    function init() {
      if (!cardTemplate) {
        showError("Card template missing – check HTML");
        return;
      }
      if (!container) {
        console.error("Posts container missing");
        return;
      }

      currentPostsPerPage = getPostsPerPage();
      currentPage = 1;

      if (totalPosts === 0) {
        if (loadmoreContainer) loadmoreContainer.style.display = 'none';
        showEmptyState();
        return;
      }

      loadmoreContainer.style.display = totalPosts <= currentPostsPerPage ? 'none' : 'block';
      loadMorePosts();

      if (loadmoreBtn) {
        loadmoreBtn.addEventListener('click', loadMorePosts);
      }
    }

    window.addEventListener('resize', debounce(() => {
      const newPerPage = getPostsPerPage();
      if (newPerPage !== currentPostsPerPage) {
        currentPostsPerPage = newPerPage;
      }
    }, 200));

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>

<style>
  /* ----- GLOBAL UTILITIES ----- */
  .visually-hidden {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0,0,0,0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  /* ----- ROUNDED CORNERS & STABLE OVERLAY ----- */
  .rounded-4 {
    border-radius: 0.75rem !important;
  }

  .card {
    border-radius: 0.75rem;
    overflow: hidden;
    /* Force GPU rendering and prevent subpixel flicker on zoom */
    transform: translateZ(0);
    backface-visibility: hidden;
    will-change: transform;
  }

  .card::before {
    border-radius: inherit;
    /* Ensure pseudo-element stays perfectly aligned */
    transform: translateZ(0);
    backface-visibility: hidden;
    /* No transition to avoid flicker */
    transition: none;
  }

  .chulapa-card-img {
    border-radius: 0.75rem 0.75rem 0 0;
    overflow: hidden;
  }

  #loadmore-btn,
  #backToTopBtn {
    border-radius: 0.75rem !important;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  #loadmore-btn:hover,
  #backToTopBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15) !important;
  }
  #loadmore-btn:active,
  #backToTopBtn:active {
    transform: translateY(0);
  }

  .hover-lift {
    transition: transform 0.2s ease-in-out;
  }
  .hover-lift:hover {
    transform: translateY(-4px);
  }

  .chulapa-min-h-10 { min-height: 12rem; }
  @media (min-width: 576px) { 
    .chulapa-min-h-10 { min-height: 10rem; } 
  }

  .stretched-link::after { z-index: 1; }
  .z-index-2 { z-index: 2; position: relative; }

  /* ----- DESKTOP (≥992px) ----- */
  @media (min-width: 992px) {
    .card-col {
      aspect-ratio: 1 / 1;
    }
    .card {
      background-size: cover;
      background-position: center;
      background-image: var(--card-bg-image, linear-gradient(135deg, #2c3e50, #3498db));
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }
    .chulapa-card-img {
      display: none !important;
    }
    .card-body {
      position: relative;
      z-index: 1;
      color: #fff;
      background: transparent;
      flex-grow: 1;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .card-title, .subtitle, .excerpt, .date, .categories-badges .badge, .tags-badges .badge {
      color: #fff !important;
    }
    .card-title a { color: #fff !important; }
    .subtitle { color: rgba(255, 255, 255, 0.8) !important; }
    .excerpt { color: rgba(255, 255, 255, 0.9) !important; }
    .border-top { border-top-color: rgba(255, 255, 255, 0.3) !important; }
    .badge {
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
    }
    .chulapa-pill-bg-secondary { background-color: rgba(108, 117, 125, 0.8); }
    .chulapa-pill-bg-primary { background-color: rgba(13, 110, 253, 0.8); }
    .card-body::-webkit-scrollbar { width: 6px; }
    .card-body::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    .card-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.5); border-radius: 10px; }
  }

  /* ----- MOBILE & TABLET (<992px) ----- */
  @media (max-width: 991.98px) {
    .card {
      background-image: none !important;
    }
    .card::before {
      display: none;
    }
    .card-body {
      color: inherit;
      background: inherit;
      border-radius: 0 0 0.75rem 0.75rem;
    }
    .card-title, .subtitle, .excerpt, .date, .badge {
      color: inherit !important;
    }
    .border-top {
      border-top-color: #dee2e6 !important;
    }
    .chulapa-card-img {
      display: block !important;
      border-radius: 0.75rem 0.75rem 0 0;
    }
  }

  /* Inner card body layout */
  .card-body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .badge {
    display: inline-block;
  }
  .row > .col, .row > [class*="col-"] {
    margin-bottom: 1rem;
  }
  @media (min-width: 768px) {
    .row > .col, .row > [class*="col-"] {
      margin-bottom: 0;
    }
  }
</style>
