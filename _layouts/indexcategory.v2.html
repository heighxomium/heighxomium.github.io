---
layout: default
---
{{ content }}

<div id="posts-container" class="row">
  <!-- Loading spinner -->
  <div class="col-12 text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Loading…</span>
    </div>
  </div>
</div>

<div id="loadmore-container" class="text-center mt-4 mb-5">
  <button id="loadmore-btn" class="btn btn-primary btn-lg px-5 py-2">
    <i class="fas fa-arrow-down mr-2"></i> Load more posts
    <i class="fas fa-spinner fa-pulse d-none ml-2" id="loadmore-spinner"></i>
  </button>
</div>

<script>
  // Configuration
  const POSTS_PER_PAGE = {{ page.posts_per_page | default: 10 }};
  let currentPage = 1;
  let allPosts = [];
  let isLoading = false;

  // All posts data (generated by Jekyll at build time)
  const allPostsData = [
    {% assign collection = site[page.include_collection] %}
    {% if page.category_name %}
      {% assign posts_to_show = collection | where: "categories", page.category_name %}
    {% elsif page.tag_name %}
      {% assign posts_to_show = collection | where: "tags", page.tag_name %}
    {% else %}
      {% assign posts_to_show = collection %}
    {% endif %}
    
    {% for post in posts_to_show %}
      {
        "title": {{ post.title | jsonify }},
        "date": {{ post.date | date: "%b %d, %Y" | jsonify }},
        "excerpt": {{ post.excerpt | strip_html | truncatewords: 30 | jsonify }},
        "url": {{ post.url | relative_url | jsonify }}
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  allPosts = allPostsData;
  
  // Remove spinner and load first batch
  const container = document.getElementById('posts-container');
  container.innerHTML = '';
  loadMorePosts();

  function loadMorePosts() {
    if (isLoading) return;
    isLoading = true;
    
    // Show spinner inside button
    const btnSpinner = document.getElementById('loadmore-spinner');
    const btn = document.getElementById('loadmore-btn');
    btnSpinner.classList.remove('d-none');
    btn.disabled = true;

    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const end = start + POSTS_PER_PAGE;
    const postsToLoad = allPosts.slice(start, end);

    if (postsToLoad.length === 0) {
      btn.innerHTML = '<i class="fas fa-check mr-2"></i> All posts loaded';
      btn.disabled = true;
      btnSpinner.classList.add('d-none');
      isLoading = false;
      return;
    }

    // Simulate a tiny delay for smoother UX (optional)
    setTimeout(() => {
      postsToLoad.forEach(post => {
        // This HTML structure matches Chulapa's components/indexcards.html exactly
        const col = document.createElement('div');
        col.className = 'col-lg-4 col-md-6 mb-4';
        col.innerHTML = `
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">${escapeHtml(post.title)}</h5>
              <h6 class="card-subtitle mb-2 text-muted">${escapeHtml(post.date)}</h6>
              <p class="card-text">${escapeHtml(post.excerpt)}</p>
              <a href="${escapeHtml(post.url)}" class="card-link">Continue reading <i class="fas fa-arrow-right ml-1"></i></a>
            </div>
          </div>
        `;
        container.appendChild(col);
      });

      currentPage++;
      isLoading = false;
      btnSpinner.classList.add('d-none');
      btn.disabled = false;
    }, 300);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Attach event listener after DOM is ready
  document.getElementById('loadmore-btn').addEventListener('click', loadMorePosts);
</script>

<style>
  /* Ensure cards have equal height and smooth transitions */
  #posts-container .card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  #posts-container .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  }
  #loadmore-btn {
    transition: all 0.3s ease;
  }
  #loadmore-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  #loadmore-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }
</style>
