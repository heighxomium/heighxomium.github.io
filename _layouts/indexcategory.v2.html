---
layout: default
---
{{ content }}

<div id="posts-container" class="row">
  <div class="col-12 text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Loading…</span>
    </div>
  </div>
</div>

<div id="loadmore-container" class="text-center mt-4 mb-5" style="display: none;">
  <button id="loadmore-btn" class="btn btn-primary btn-lg px-5 py-2 rounded-pill shadow-sm">
    <i class="fas fa-arrow-down mr-2"></i> Load more posts
    <i class="fas fa-spinner fa-pulse d-none ml-2" id="loadmore-spinner"></i>
  </button>
</div>

<script>
  // Configuration
  const POSTS_PER_PAGE = {{ page.posts_per_page | default: 10 }};
  let currentPage = 1;
  let allPosts = [];
  let isLoading = false;

  // Global fallback image from Chulapa's _config.yml (og_image)
  const DEFAULT_HEADER_IMG = "{{ site.og_image | default: '/assets/images/default-header.jpg' }}";

  // All posts data (generated by Jekyll at build time)
  const allPostsData = [
    {% assign collection = site[page.include_collection] %}
    {% if page.category_name %}
      {% assign posts_to_show = collection | where: "categories", page.category_name %}
    {% elsif page.tag_name %}
      {% assign posts_to_show = collection | where: "tags", page.tag_name %}
    {% else %}
      {% assign posts_to_show = collection %}
    {% endif %}
    
    {% for post in posts_to_show %}
      {
        "title": {{ post.title | jsonify }},
        "date": {{ post.date | date: "%b %d, %Y" | jsonify }},
        "excerpt": {{ post.excerpt | strip_html | truncatewords: 30 | jsonify }},
        "url": {{ post.url | relative_url | jsonify }},
        "image": {{ post.header_img | default: post.image | default: DEFAULT_HEADER_IMG | jsonify }}
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  allPosts = allPostsData;
  
  // Remove spinner and start building the grid
  const container = document.getElementById('posts-container');
  container.innerHTML = '';

  // Show load more only if total posts exceed POSTS_PER_PAGE
  const totalPosts = allPosts.length;
  if (totalPosts > POSTS_PER_PAGE) {
    document.getElementById('loadmore-container').style.display = 'block';
  }

  loadMorePosts();

  function loadMorePosts() {
    if (isLoading) return;
    isLoading = true;
    
    const btnSpinner = document.getElementById('loadmore-spinner');
    const btn = document.getElementById('loadmore-btn');
    if (btnSpinner && btn) {
      btnSpinner.classList.remove('d-none');
      btn.disabled = true;
    }

    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const end = start + POSTS_PER_PAGE;
    const postsToLoad = allPosts.slice(start, end);

    if (postsToLoad.length === 0) {
      if (btn) {
        btn.innerHTML = '<i class="fas fa-check mr-2"></i> All posts loaded';
        btn.disabled = true;
      }
      if (btnSpinner) btnSpinner.classList.add('d-none');
      isLoading = false;
      return;
    }

    setTimeout(() => {
      postsToLoad.forEach(post => {
        const col = document.createElement('div');
        col.className = 'col-lg-4 col-md-6 mb-4';
        
        let imageUrl = post.image;
        let imageHtml = '';
        
        if (imageUrl && imageUrl !== DEFAULT_HEADER_IMG) {
          imageHtml = `
            <div class="card-img-top rounded-top" style="height: 200px; background-size: cover; background-position: center; background-image: url('${escapeHtml(imageUrl)}');">
            </div>
          `;
        } else {
          // Fallback icon when no custom image
          imageHtml = `
            <div class="card-img-top rounded-top bg-secondary d-flex align-items-center justify-content-center" style="height: 200px;">
              <i class="fas fa-image fa-3x text-white-50"></i>
            </div>
          `;
        }
        
        col.innerHTML = `
          <div class="card h-100 rounded-4 shadow-sm overflow-hidden">
            ${imageHtml}
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${escapeHtml(post.title)}</h5>
              <h6 class="card-subtitle mb-2 text-muted">${escapeHtml(post.date)}</h6>
              <p class="card-text">${escapeHtml(post.excerpt)}</p>
              <a href="${escapeHtml(post.url)}" class="btn btn-outline-primary rounded-pill mt-auto align-self-start">
                Continue reading <i class="fas fa-arrow-right ms-1"></i>
              </a>
            </div>
          </div>
        `;
        container.appendChild(col);
      });

      currentPage++;
      isLoading = false;
      if (btnSpinner) btnSpinner.classList.add('d-none');
      if (btn) btn.disabled = false;
    }, 200);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('loadmore-btn');
    if (btn) btn.addEventListener('click', loadMorePosts);
  });
</script>

<style>
  /* Rounded corners for cards */
  #posts-container .card {
    border-radius: 1rem !important;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  #posts-container .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0.75rem 1.5rem rgba(0,0,0,0.15);
  }
  .card-img-top {
    border-top-left-radius: 1rem !important;
    border-top-right-radius: 1rem !important;
    transition: transform 0.3s ease;
  }
  .card:hover .card-img-top {
    transform: scale(1.02);
  }
  /* Pill button styling */
  .btn-outline-primary.rounded-pill {
    border-radius: 50px !important;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 0.5px;
    padding: 0.4rem 1rem;
  }
  .btn-outline-primary.rounded-pill i {
    transition: transform 0.2s ease;
  }
  .btn-outline-primary.rounded-pill:hover i {
    transform: translateX(4px);
  }
  /* Load more button */
  #loadmore-btn {
    border-radius: 50px !important;
    transition: all 0.3s ease;
  }
  #loadmore-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  #loadmore-btn:disabled {
    opacity: 0.7;
    transform: none;
  }
  </style>
