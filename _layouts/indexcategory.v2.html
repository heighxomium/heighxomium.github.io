---
layout: default
---
{{ content }}

<div class="row">
  <div id="posts-container" class="col-12">
    <!-- Loading spinner -->
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading…</span>
      </div>
    </div>
  </div>
</div>

<div id="loadmore-container" class="text-center mt-4 mb-5" style="display: none;">
  <button id="loadmore-btn" class="btn btn-primary btn-lg px-5 py-2 rounded-pill shadow-sm">
    <i class="fas fa-arrow-down mr-2"></i> Load more posts
    <i class="fas fa-spinner fa-pulse d-none ml-2" id="loadmore-spinner"></i>
  </button>
</div>

<script>
  // Configuration
  const POSTS_PER_PAGE = {{ page.posts_per_page | default: 10 }};
  let currentPage = 1;
  let allPosts = [];
  let isLoading = false;

  // Build posts data
  const allPostsData = [
    {% assign collection = site[page.include_collection] %}
    {% if page.category_name %}
      {% assign posts_to_show = collection | where: "categories", page.category_name %}
    {% elsif page.tag_name %}
      {% assign posts_to_show = collection | where: "tags", page.tag_name %}
    {% else %}
      {% assign posts_to_show = collection %}
    {% endif %}
    
    {% for post in posts_to_show %}
      {
        "title": {{ post.title | jsonify }},
        "subtitle": {{ post.subtitle | jsonify }},
        "date": {{ post.date | date: "%d/%m/%Y" | jsonify }},
        "excerpt": {{ post.excerpt | strip_html | jsonify }},
        "url": {{ post.url | absolute_url | jsonify }},
        "og_image": {{ post.og_image | default: post.header_img | jsonify }},
        "categories": [
          {% for cat in post.categories %}
            { "name": {{ cat | jsonify }}, "url": {{ cat | replace: " ", "-" | prepend: "#" | prepend: post.cloudcategory_url | absolute_url | uri_escape | jsonify }} }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ],
        "tags": [
          {% for tag in post.tags %}
            { "name": {{ tag | jsonify }}, "url": {{ tag | replace: " ", "-" | prepend: "#" | prepend: post.cloudtag_url | absolute_url | uri_escape | jsonify }} }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ]
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  allPosts = allPostsData;
  
  const container = document.getElementById('posts-container');
  container.innerHTML = '';

  const totalPosts = allPosts.length;
  if (totalPosts <= POSTS_PER_PAGE) {
    document.getElementById('loadmore-container').style.display = 'none';
  }

  loadMorePosts();

  function loadMorePosts() {
    if (isLoading) return;
    isLoading = true;
    
    const btnSpinner = document.getElementById('loadmore-spinner');
    const btn = document.getElementById('loadmore-btn');
    if (btnSpinner && btn) {
      btnSpinner.classList.remove('d-none');
      btn.disabled = true;
    }

    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const end = start + POSTS_PER_PAGE;
    const postsToLoad = allPosts.slice(start, end);

    if (postsToLoad.length === 0) {
      replaceWithBackToTop();
      isLoading = false;
      return;
    }

    setTimeout(() => {
      postsToLoad.forEach(post => {
        // Build image block (same as indexcards.html)
        let imageBlock = '';
        if (post.og_image) {
          imageBlock = `
            <a href="${escapeHtml(post.url)}" class="col-sm-1 chulapa-min-h-10 chulapa-card-img chulapa-overlay-img chulapa-gradient"
               style="background-image: url('${escapeHtml(post.og_image)}')">
            </a>
          `;
        } else {
          imageBlock = `<div class="col-sm-1 d-none d-sm-flex"></div>`;
        }

        // Build categories badges
        let categoriesHtml = '';
        if (post.categories && post.categories.length) {
          categoriesHtml = post.categories.map(cat => `
            <a href="${escapeHtml(cat.url)}" class="badge chulapa-pill-bg-secondary mx-1 position-relative" style="z-index: 2;">${escapeHtml(cat.name)}</a>
          `).join('');
        }

        // Build tags badges
        let tagsHtml = '';
        if (post.tags && post.tags.length) {
          tagsHtml = post.tags.map(tag => `
            <a href="${escapeHtml(tag.url)}" class="badge chulapa-pill-bg-primary mx-1 position-relative" style="z-index: 2;">${escapeHtml(tag.name)}</a>
          `).join('');
        }

        const cardHtml = `
          <div class="col-12 mb-2">
            <div class="card chulapa-border-card-index rounded-4 shadow-sm h-100 position-relative">
              <div class="row g-0">
                ${imageBlock}
                <div class="col-sm">
                  <article class="card-body chulapa-links-hover-only">
                    <a href="${escapeHtml(post.url)}" class="stretched-link"><h5 class="card-title">${escapeHtml(post.title)}</h5></a>
                    ${post.subtitle ? `<h6 class="card-subtitle mb-2 text-muted">${escapeHtml(post.subtitle)}</h6>` : ''}
                    <div class="card-text mb-3">${escapeHtml(post.excerpt)}</div>
                    <a href="${escapeHtml(post.url)}" class="btn btn-outline-primary rounded-pill mt-2 position-relative" style="z-index: 2;">
                      Continue reading <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                  </article>
                  <div class="border-top-0 card-footer border-primary chulapa-bg-transparent mt-2">
                    ${post.date ? `<p class="small text-right font-italic mb-1"><time datetime="${escapeHtml(post.date)}">${escapeHtml(post.date)}</time></p>` : ''}
                    ${categoriesHtml}
                    ${tagsHtml}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });

      currentPage++;
      isLoading = false;
      if (btnSpinner) btnSpinner.classList.add('d-none');
      if (btn) btn.disabled = false;

      if (currentPage > Math.ceil(totalPosts / POSTS_PER_PAGE)) {
        replaceWithBackToTop();
      }
    }, 200);
  }

  function replaceWithBackToTop() {
    const btnContainer = document.getElementById('loadmore-container');
    if (!btnContainer) return;
    
    btnContainer.innerHTML = `
      <button id="backToTopBtn" class="btn btn-secondary btn-lg px-5 py-2 rounded-pill shadow-sm">
        Back to top
      </button>
    `;
    
    const backBtn = document.getElementById('backToTopBtn');
    if (backBtn) {
      backBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('loadmore-btn');
    if (btn) btn.addEventListener('click', loadMorePosts);
  });
</script>

<style>
  /* Ensure consistent card styling */
  .rounded-4 { border-radius: 0.75rem !important; }
  .card .btn-outline-primary {
    transition: all 0.2s ease;
  }
  .card .btn-outline-primary:hover i {
    transform: translateX(4px);
  }
  .card .btn-outline-primary i {
    transition: transform 0.2s ease;
  }
  /* Stretched-link override */
  .stretched-link::after {
    z-index: 1;
  }
  .position-relative {
    position: relative;
  }
  .card-footer a.badge {
    z-index: 2;
    position: relative;
  }
  /* Load more and back to top buttons */
  #loadmore-btn, #backToTopBtn {
    border-radius: 50px !important;
    transition: all 0.3s ease;
  }
  #loadmore-btn:hover, #backToTopBtn:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
</style>
