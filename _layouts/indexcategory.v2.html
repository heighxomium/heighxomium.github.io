---
layout: default
---
{{ content }}

<div class="container px-lg-3">
  <div id="posts-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-2 g-4">
    <!-- Initial loading spinner -->
    <div class="col-12 text-center py-5" id="initial-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading posts…</span>
      </div>
    </div>
  </div>

  <div id="loadmore-container" class="d-flex justify-content-center mt-5 mb-5" style="display: none;">
    <button id="loadmore-btn" class="btn btn-primary btn-lg px-5 py-2 rounded-4 shadow-sm transition-transform" aria-label="Load more posts">
      <i class="fas fa-arrow-down me-2" aria-hidden="true"></i> Load more posts
      <i class="fas fa-spinner fa-pulse d-none ms-2" id="loadmore-spinner" aria-hidden="true"></i>
    </button>
  </div>
</div>

<template id="card-template">
  <div class="col mb-4 card-col">
    <div class="card chulapa-border-card-index rounded-4 shadow-sm h-100 position-relative overflow-hidden hover-lift">
      <!-- This div becomes full background on desktop, stays top image on mobile -->
      <div class="chulapa-min-h-10 chulapa-card-img chulapa-overlay-img chulapa-gradient" style="background-size: cover; background-position: center;" aria-label="Post thumbnail"></div>
      <div class="card-body d-flex flex-column flex-grow-1 overflow-auto position-relative">
        <article class="flex-grow-1">
          <a href="#" class="stretched-link title-link text-decoration-none"><h5 class="card-title fw-bold mb-2"></h5></a>
          <h6 class="card-subtitle mb-2 text-muted subtitle"></h6>
          <div class="card-text mb-3 excerpt text-secondary small"></div>
        </article>
        <div class="border-top pt-3 mt-auto">
          <p class="small text-end fst-italic mb-2 date"></p>
          <div class="categories-badges mb-2"></div>
          <div class="tags-badges"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  // Helper: Debounce function
  function debounce(func, wait) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), wait);
    };
  }

  // Helper: get posts per page based on screen width
  function getPostsPerPage() {
    return window.innerWidth >= 992 ? 12 : 10;
  }

  let currentPage = 1;
  let currentPostsPerPage = getPostsPerPage();
  let isLoading = false;

  // ----- EMBEDDED POSTS DATA (with full image fallback and URL fixing) -----
  const allPosts = [
    {% assign collection = site[page.include_collection] %}
    {% assign collection_default_img = collection.header_img | default: collection.og_image %}
    {% if page.category_name %}
      {% assign posts_to_show = collection | where: "categories", page.category_name %}
    {% elsif page.tag_name %}
      {% assign posts_to_show = collection | where: "tags", page.tag_name %}
    {% else %}
      {% assign posts_to_show = collection %}
    {% endif %}

    {% for post in posts_to_show %}
      {% assign img = post.og_image | default: post.header_img %}
      {% if img == nil and collection_default_img %}
        {% assign img = collection_default_img %}
      {% endif %}
      
      {% assign full_img = nil %}
      {% if img %}
        {% unless img contains "://" %}
          {% assign full_img = img | prepend: site.url | replace: "//", "/" %}
        {% else %}
          {% assign full_img = img %}
        {% endunless %}
      {% endif %}
      
      {
        "title": {{ post.title | jsonify }},
        "subtitle": {{ post.subtitle | jsonify }},
        "date": {{ post.date | date: "%d/%m/%Y" | jsonify }},
        "excerpt": {{ post.excerpt | strip_html | truncatewords: 20 | jsonify }},
        "url": {{ post.url | absolute_url | jsonify }},
        "og_image": {{ full_img | jsonify }},
        "categories": [
          {% for cat in post.categories %}
            { "name": {{ cat | jsonify }}, "url": {{ cat | replace: " ", "-" | prepend: "#" | prepend: post.cloudcategory_url | absolute_url | uri_escape | jsonify }} }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ],
        "tags": [
          {% for tag in post.tags %}
            { "name": {{ tag | jsonify }}, "url": {{ tag | replace: " ", "-" | prepend: "#" | prepend: post.cloudtag_url | absolute_url | uri_escape | jsonify }} }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ]
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  const totalPosts = allPosts.length;

  // DOM elements
  const container = document.getElementById('posts-container');
  const loadmoreContainer = document.getElementById('loadmore-container');
  const loadmoreBtn = document.getElementById('loadmore-btn');
  const btnSpinner = document.getElementById('loadmore-spinner');
  const initialSpinner = document.getElementById('initial-spinner');

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
  }

  function renderPost(post) {
    const template = document.getElementById('card-template');
    const clone = template.content.cloneNode(true);
    
    const titleLink = clone.querySelector('.title-link');
    titleLink.href = post.url;
    titleLink.querySelector('.card-title').textContent = post.title;
    
    const subtitleEl = clone.querySelector('.subtitle');
    if (post.subtitle) {
      subtitleEl.textContent = post.subtitle;
    } else {
      subtitleEl.style.display = 'none';
    }
    
    clone.querySelector('.excerpt').textContent = post.excerpt;
    
    const dateEl = clone.querySelector('.date');
    if (post.date) {
      dateEl.innerHTML = `<time datetime="${escapeHtml(post.date)}"><i class="far fa-calendar-alt me-1"></i>${escapeHtml(post.date)}</time>`;
    } else {
      dateEl.parentElement.style.display = 'none';
    }
    
    // Set image on the separate div – works for both mobile and desktop
    const imageDiv = clone.querySelector('.chulapa-card-img');
    if (post.og_image && post.og_image.trim() !== '') {
      imageDiv.style.backgroundImage = `url('${escapeHtml(post.og_image)}')`;
      imageDiv.classList.remove('d-none');
    } else {
      // Keep fallback background (gradient or solid color)
      imageDiv.style.backgroundImage = 'none';
      imageDiv.classList.remove('d-none');
    }
    
    const catContainer = clone.querySelector('.categories-badges');
    if (post.categories?.length) {
      post.categories.forEach(cat => {
        const badge = document.createElement('a');
        badge.href = cat.url;
        badge.className = 'badge chulapa-pill-bg-secondary me-1 mb-1 z-index-2';
        badge.textContent = cat.name;
        catContainer.appendChild(badge);
      });
    }
    
    const tagContainer = clone.querySelector('.tags-badges');
    if (post.tags?.length) {
      post.tags.forEach(tag => {
        const badge = document.createElement('a');
        badge.href = tag.url;
        badge.className = 'badge chulapa-pill-bg-primary me-1 mb-1 z-index-2';
        badge.textContent = tag.name;
        tagContainer.appendChild(badge);
      });
    }
    
    return clone;
  }

  function loadMorePosts() {
    if (isLoading) return;
    isLoading = true;
    
    if (btnSpinner && loadmoreBtn) {
      btnSpinner.classList.remove('d-none');
      loadmoreBtn.disabled = true;
    }
    
    const start = (currentPage - 1) * currentPostsPerPage;
    const end = start + currentPostsPerPage;
    const postsToLoad = allPosts.slice(start, end);
    
    if (postsToLoad.length === 0) {
      replaceWithBackToTop();
      isLoading = false;
      return;
    }
    
    setTimeout(() => {
      if (initialSpinner) initialSpinner.remove();
      
      const fragment = document.createDocumentFragment();
      postsToLoad.forEach(post => fragment.appendChild(renderPost(post)));
      container.appendChild(fragment);
      
      currentPage++;
      isLoading = false;
      
      if (btnSpinner) btnSpinner.classList.add('d-none');
      if (loadmoreBtn) loadmoreBtn.disabled = false;
      
      if (currentPage * currentPostsPerPage > totalPosts) {
        replaceWithBackToTop();
      }
    }, 150);
  }

  function replaceWithBackToTop() {
    if (!loadmoreContainer) return;
    loadmoreContainer.innerHTML = `
      <button id="backToTopBtn" class="btn btn-secondary btn-lg px-5 py-2 rounded-4 shadow-sm transition-transform">
        <i class="fas fa-arrow-up me-2"></i> Back to top
      </button>
    `;
    document.getElementById('backToTopBtn')?.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  function init() {
    currentPostsPerPage = getPostsPerPage();
    currentPage = 1;
    loadmoreContainer.style.display = totalPosts <= currentPostsPerPage ? 'none' : 'block';
    loadMorePosts();
    loadmoreBtn?.addEventListener('click', loadMorePosts);
  }
  
  window.addEventListener('resize', debounce(() => {
    const newPostsPerPage = getPostsPerPage();
    if (newPostsPerPage !== currentPostsPerPage) {
      currentPostsPerPage = newPostsPerPage;
    }
  }, 250));

  document.addEventListener('DOMContentLoaded', init);
</script>

<style>
  /* Spinner fix: visually hidden text */
  .visually-hidden {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0,0,0,0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  .rounded-4 { border-radius: 0.75rem !important; }
  .stretched-link::after { z-index: 1; }
  .z-index-2 { z-index: 2; position: relative; }
  
  /* Animations */
  .transition-transform { transition: transform 0.3s ease, box-shadow 0.3s ease; }
  #loadmore-btn:hover, #backToTopBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important;
  }
  #loadmore-btn:active, #backToTopBtn:active { transform: translateY(0); }
  .hover-lift { transition: transform 0.2s ease-in-out; }
  .hover-lift:hover { transform: translateY(-4px); }

  .fade-in-up {
    animation: fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
    opacity: 0;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chulapa-min-h-10 { min-height: 12rem; }
  @media (min-width: 576px) { .chulapa-min-h-10 { min-height: 10rem; } }
  
  /* ========== DESKTOP (≥992px): Full-card background using existing image div ========== */
  @media (min-width: 992px) {
    .card-col {
      aspect-ratio: 1 / 1;
    }
    .card {
      background: transparent !important;
    }
    .chulapa-card-img {
      position: absolute !important;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover !important;
      background-position: center !important;
      border-radius: inherit;
      z-index: 0;
      min-height: auto !important;
    }
    /* Dark overlay for text readability */
    .chulapa-card-img::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      border-radius: inherit;
      pointer-events: none;
    }
    .card-body {
      position: relative;
      z-index: 2;
      color: #fff;
      background: transparent;
      flex-grow: 1;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    /* White text overrides */
    .card-title, .card-title a, .subtitle, .excerpt, .date, .date i, .date time,
    .categories-badges .badge, .tags-badges .badge {
      color: #fff !important;
    }
    .subtitle { color: rgba(255,255,255,0.8) !important; }
    .excerpt { color: rgba(255,255,255,0.9) !important; }
    .border-top { border-top-color: rgba(255,255,255,0.3) !important; }
    /* Badges semi-transparent */
    .badge {
      background-color: rgba(0,0,0,0.6) !important;
      backdrop-filter: blur(2px);
    }
    .chulapa-pill-bg-secondary { background-color: rgba(108,117,125,0.8) !important; }
    .chulapa-pill-bg-primary { background-color: rgba(13,110,253,0.8) !important; }
    /* Scrollbar */
    .card-body::-webkit-scrollbar { width: 6px; }
    .card-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); border-radius: 10px; }
    .card-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); border-radius: 10px; }
  }
  
  /* ========== MOBILE/TABLET (below 992px): Original top-image layout ========== */
  @media (max-width: 991.98px) {
    .chulapa-card-img {
      position: static !important;
      width: auto !important;
      height: auto !important;
      min-height: 10rem;
    }
    .chulapa-card-img::after {
      display: none;
    }
    .card-body {
      color: inherit;
      background: inherit;
      overflow-y: visible;
    }
    .card-title, .card-title a, .subtitle, .excerpt, .date, .badge {
      color: inherit !important;
    }
    .border-top {
      border-top-color: #dee2e6 !important;
    }
    .badge {
      background-color: inherit !important;
      backdrop-filter: none;
    }
  }

  /* Base styles */
  .card {
    display: flex;
    flex-direction: column;
  }
  .card-body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .badge {
    display: inline-block;
  }
  
  /* Gutter fallback */
  .row > .col,
  .row > [class*="col-"] {
    margin-bottom: 1rem;
  }
  @media (min-width: 768px) {
    .row > .col,
    .row > [class*="col-"] {
      margin-bottom: 0;
    }
  }
</style>
