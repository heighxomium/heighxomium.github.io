---
layout: default
---
{{ content }}

<div class="container px-lg-3">
  <div id="posts-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-2 g-4">
    <div class="col-12 text-center py-5" id="initial-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading posts…</span>
      </div>
    </div>
  </div>

  <div id="loadmore-container"
       class="d-flex justify-content-center mt-5 mb-5"
       style="display:none;"
       aria-live="polite">
    <button id="loadmore-btn"
            class="btn btn-primary btn-lg px-5 py-2 rounded-4 shadow-sm btn-action"
            aria-label="Load more posts">
      <i class="fas fa-arrow-down me-2" aria-hidden="true"></i>Load more posts
      <i class="fas fa-spinner fa-pulse d-none ms-2" id="loadmore-spinner" aria-hidden="true"></i>
    </button>
  </div>
</div>

<template id="card-template">
  <div class="col card-col">
    <!--
      FIX E: added "post-card" class so all post-specific CSS rules are scoped
      to this component only and never bleed into other Bootstrap cards.
    -->
    <div class="card post-card chulapa-border-card-index rounded-4 shadow-sm h-100 position-relative overflow-hidden hover-lift">
      <div class="chulapa-min-h-10 chulapa-card-img chulapa-overlay-img"
           style="background-size:cover;background-position:center;"
           role="img"
           aria-label="Post thumbnail"></div>
      <div class="card-body d-flex flex-column flex-grow-1 position-relative">
        <article class="flex-grow-1">
          <a href="#" class="stretched-link title-link text-decoration-none">
            <h5 class="card-title fw-bold mb-2"></h5>
          </a>
          <h6 class="card-subtitle mb-2 text-muted subtitle"></h6>
          <div class="card-text mb-3 excerpt text-secondary small"></div>
        </article>
        <div class="border-top pt-3 mt-auto">
          <p class="small text-end fst-italic mb-2 date"></p>
          <div class="categories-badges mb-2"></div>
          <div class="tags-badges"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
(function () {
  'use strict';

  // ── CONFIGURATION ──────────────────────────────────────────────────────
  const POSTS_PER_PAGE_DESKTOP = 12;
  const POSTS_PER_PAGE_MOBILE  = 10;
  const BREAKPOINT_LG          = 992;

  // ── DOM REFS ───────────────────────────────────────────────────────────
  const cardTemplate      = document.getElementById('card-template');
  const container         = document.getElementById('posts-container');
  const loadmoreContainer = document.getElementById('loadmore-container');
  const loadmoreBtn       = document.getElementById('loadmore-btn');
  const btnSpinner        = document.getElementById('loadmore-spinner');
  const initialSpinner    = document.getElementById('initial-spinner');

  // ── STATE ──────────────────────────────────────────────────────────────
  let renderedCount       = 0;
  let currentPostsPerPage = getPostsPerPage();
  let isLoading           = false;

  // ── LIQUID DATA ────────────────────────────────────────────────────────
  // The console.warn lives here, OUTSIDE the array literal, so it cannot
  // be evaluated as an array element expression → [undefined, post, …].
  {%- assign collection = site[page.include_collection] -%}
  {%- unless collection %}
  console.warn("indexcategory: collection '{{ page.include_collection }}' not found.");
  {%- endunless -%}

  {%- assign default_img = site.default_header_image | absolute_url -%}
  {%- if page.category_name -%}
    {%- assign posts_to_show = collection | where: "categories", page.category_name -%}
  {%- elsif page.tag_name -%}
    {%- assign posts_to_show = collection | where: "tags", page.tag_name -%}
  {%- else -%}
    {%- assign posts_to_show = collection -%}
  {%- endif -%}

  let allPosts = [];
  try {
    allPosts = [
      {%- for post in posts_to_show -%}
        {%- capture img -%}
          {%- if post.og_image    -%}{{ post.og_image    | absolute_url }}
          {%- elsif post.header_img -%}{{ post.header_img  | absolute_url }}
          {%- elsif default_img != "" -%}{{ default_img }}
          {%- endif -%}
        {%- endcapture -%}
        {%- assign img_clean = img | strip -%}
        {
          "title":      {{ post.title    | jsonify }},
          "subtitle":   {{ post.subtitle | jsonify }},
          "date":       {{ post.date | date: "%d/%m/%Y" | jsonify }},
          "excerpt":    {{ post.excerpt | strip_html | truncatewords: 20 | jsonify }},
          "url":        {{ post.url | absolute_url | jsonify }},
          "og_image":   {% if img_clean != "" %}{{ img_clean | jsonify }}{% else %}null{% endif %},
          "categories": [
            {%- for cat in post.categories -%}
              { "name": {{ cat | jsonify }},
                "url":  {{ cat | replace: " ", "-" | prepend: "#" | prepend: post.cloudcategory_url | absolute_url | uri_escape | jsonify }}
              }{% unless forloop.last %},{% endunless %}
            {%- endfor -%}
          ],
          "tags": [
            {%- for tag in post.tags -%}
              { "name": {{ tag | jsonify }},
                "url":  {{ tag | replace: " ", "-" | prepend: "#" | prepend: post.cloudtag_url | absolute_url | uri_escape | jsonify }}
              }{% unless forloop.last %},{% endunless %}
            {%- endfor -%}
          ]
        }{% unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ];
  } catch (e) {
    console.error('Failed to parse Liquid posts data:', e);
  }

  const totalPosts = allPosts.length;

  // ── UTILITIES ──────────────────────────────────────────────────────────

  function getPostsPerPage() {
    return window.innerWidth >= BREAKPOINT_LG
      ? POSTS_PER_PAGE_DESKTOP
      : POSTS_PER_PAGE_MOBILE;
  }

  /**
   * Escape for use inside a CSS url("…") double-quoted string.
   * Only " and \ need escaping per the CSS spec.
   * DO NOT use escapeHtml here — &amp; inside url() corrupts the URL.
   */
  function cssUrlEscape(url) {
    return url.replace(/["\\]/g, ch => (ch === '\\' ? '\\\\' : '\\"'));
  }

  /** Full HTML escaping including quotes for safe attribute + text insertion. */
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, ch => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));
  }

  function debounce(fn, ms) {
    let t;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  function removeInitialSpinner() {
    if (initialSpinner && initialSpinner.parentNode) initialSpinner.remove();
  }

  // ── UI HELPERS ─────────────────────────────────────────────────────────

  function showEmptyState() {
    removeInitialSpinner();
    const el = document.createElement('div');
    el.className = 'col-12 text-center py-5';
    el.innerHTML = '<p class="lead text-muted">No posts found.</p>';
    container.appendChild(el);
  }

  function showError(msg) {
    removeInitialSpinner();
    const el = document.createElement('div');
    el.className = 'col-12 text-center py-5 alert alert-danger';
    el.textContent = 'Error loading posts: ' + msg;
    container.appendChild(el);
  }

  function setButtonLoading(on) {
    if (loadmoreBtn) loadmoreBtn.disabled = on;
    if (btnSpinner)  btnSpinner.classList.toggle('d-none', !on);
  }

  /**
   * Swap "Load more" for "Back to top".
   * FIX F: explicitly moves keyboard focus to the new button (with preventScroll
   * so the viewport doesn't jump) — without this, focus silently drops to <body>
   * when the load-more button's DOM node is destroyed, stranding keyboard users.
   */
  function replaceWithBackToTop() {
    if (!loadmoreContainer) return;
    loadmoreContainer.innerHTML = `
      <button class="btn btn-secondary btn-lg px-5 py-2 rounded-4 shadow-sm btn-action"
              aria-label="Scroll back to top">
        <i class="fas fa-arrow-up me-2" aria-hidden="true"></i>Back to top
      </button>`;
    const btn = loadmoreContainer.querySelector('button');
    btn?.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    // FIX F: restore focus so keyboard and screen-reader users are not abandoned.
    btn?.focus({ preventScroll: true });
  }

  // ── RENDERING ──────────────────────────────────────────────────────────

  function renderPost(post) {
    const clone    = cardTemplate.content.cloneNode(true);
    const card     = clone.querySelector('.card');
    const imageDiv = clone.querySelector('.chulapa-card-img');
    const hasImage = typeof post.og_image === 'string' && post.og_image.length > 0;

    // Desktop: card background via CSS custom property.
    card.style.setProperty(
      '--card-bg-image',
      hasImage
        ? `url("${cssUrlEscape(post.og_image)}")`
        : 'linear-gradient(135deg, #2c3e50, #3498db)'
    );

    if (hasImage) {
      // Mobile: background on the dedicated image div.
      // cssUrlEscape is mandatory — escapeHtml would produce &amp; inside url().
      imageDiv.style.backgroundImage = `url("${cssUrlEscape(post.og_image)}")`;
      imageDiv.setAttribute('aria-label', escapeHtml(post.title || '') + ' thumbnail');
    } else {
      /**
       * FIX A: CRITICAL — was `imageDiv.hidden = true`.
       *
       * The mobile media query sets `.chulapa-card-img { display: block !important }`.
       * The browser's default `[hidden] { display: none }` carries NO !important,
       * so it loses the specificity battle — the image div stayed visible as a
       * blank 12rem strip on every post without a cover image.
       *
       * Bootstrap's `.d-none` resolves to `display: none !important`, which wins.
       */
      imageDiv.classList.add('d-none');
    }

    // Title + link
    const titleLink = clone.querySelector('.title-link');
    titleLink.href  = post.url || '#';
    titleLink.querySelector('.card-title').textContent = post.title || '(Untitled)';

    // Subtitle
    const subtitleEl = clone.querySelector('.subtitle');
    if (post.subtitle) {
      subtitleEl.textContent = post.subtitle;
    } else {
      subtitleEl.hidden = true; // No !important conflict: .subtitle has no display rule
    }

    // Excerpt
    clone.querySelector('.excerpt').textContent = post.excerpt || '';

    // Date — hide only the <p>, not the parent .border-top (which holds badges)
    const dateEl = clone.querySelector('.date');
    if (post.date) {
      const safe = escapeHtml(post.date);
      dateEl.innerHTML =
        `<time datetime="${safe}">` +
        `<i class="far fa-calendar-alt me-1" aria-hidden="true"></i>${safe}` +
        `</time>`;
    } else {
      dateEl.hidden = true; // No !important conflict: .date has no display rule
    }

    // Category badges
    const catContainer = clone.querySelector('.categories-badges');
    for (const cat of (post.categories || [])) {
      const a = document.createElement('a');
      a.href        = cat.url  || '#';
      a.className   = 'badge chulapa-pill-bg-secondary me-1 mb-1 z-index-2';
      a.textContent = cat.name || '';
      catContainer.appendChild(a);
    }

    // Tag badges
    const tagContainer = clone.querySelector('.tags-badges');
    for (const tag of (post.tags || [])) {
      const a = document.createElement('a');
      a.href        = tag.url  || '#';
      a.className   = 'badge chulapa-pill-bg-primary me-1 mb-1 z-index-2';
      a.textContent = tag.name || '';
      tagContainer.appendChild(a);
    }

    return clone;
  }

  // ── LOAD MORE ──────────────────────────────────────────────────────────

  function loadMorePosts() {
    if (isLoading) return;
    isLoading = true;
    setButtonLoading(true);

    const batch = allPosts.slice(renderedCount, renderedCount + currentPostsPerPage);

    const fragment = document.createDocumentFragment();
    for (const post of batch) {
      try {
        fragment.appendChild(renderPost(post));
      } catch (err) {
        console.error('Failed to render post:', err, post);
      }
    }
    container.appendChild(fragment);
    removeInitialSpinner();

    renderedCount += batch.length;
    isLoading = false;
    setButtonLoading(false);

    // Replace load-more with back-to-top only when the container is already
    // visible (i.e. at least one user-triggered load occurred). During init's
    // first load the container is still display:none, so this branch is skipped
    // and the container stays hidden when all posts fit on a single page.
    if (renderedCount >= totalPosts && loadmoreContainer.style.display !== 'none') {
      replaceWithBackToTop();
    }
  }

  // ── INIT ───────────────────────────────────────────────────────────────

  function init() {
    if (!cardTemplate)      { showError('Card template element missing.');   return; }
    if (!container)         { console.error('Posts container missing.');     return; }
    if (!loadmoreContainer) { console.error('Load-more container missing.'); return; }
    if (totalPosts === 0)   { showEmptyState();                              return; }

    currentPostsPerPage = getPostsPerPage();
    loadMorePosts();

    if (renderedCount < totalPosts) {
      loadmoreContainer.style.display = 'flex';
      loadmoreBtn?.addEventListener('click', loadMorePosts);
    }
  }

  // renderedCount is viewport-agnostic; updating perPage alone is sufficient.
  window.addEventListener('resize', debounce(() => {
    currentPostsPerPage = getPostsPerPage();
  }, 200));

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}());
</script>

<style>
  /* ── GLOBAL UTILITIES ───────────────────────────────────────────────── */
  .visually-hidden {
    position: absolute !important;
    width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0,0,0,0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  .rounded-4 { border-radius: 0.75rem !important; }

  /* ── POST CARD ──────────────────────────────────────────────────────────
     FIX E: Every rule that was on the global `.card` selector and only
     applies to post-index cards is now scoped to `.post-card`.  This
     prevents bleed into any other Bootstrap card component on the page.
  ─────────────────────────────────────────────────────────────────────── */
  .post-card {
    border-radius: 0.75rem;
    overflow: hidden;             /* clips children to the rounded corners      */
    background-clip: padding-box; /* prevents background bleeding past border   */

    /*
     * isolation:isolate creates a self-contained stacking context so the
     * z-index ladder (::before=0, card-body=1, badges=2) is local to each
     * card and cannot interfere with the rest of the page.  It also
     * mitigates the Safari ≤14 overflow+border-radius clipping bug without
     * the GPU memory cost of transform:translateZ(0).
     */
    isolation: isolate;
  }

  /* Dark overlay pseudo-element (activated on desktop — see @media below) */
  .post-card::before {
    content: '';
    position: absolute;
    /* FIX B: explicit properties instead of `inset` shorthand.
       `inset` is unsupported in Safari < 14.1; the overlay disappeared
       entirely on those versions, leaving unreadable text on bg images. */
    top: 0; right: 0; bottom: 0; left: 0;
    /*
     * Border-radius must match .post-card exactly.  Without it, Safari's
     * compositing engine renders a 1px subpixel bleed at the card corners
     * where the overlay and the card border-radius don't align.
     */
    border-radius: 0.75rem;
    pointer-events: none;
  }

  .chulapa-card-img {
    border-radius: 0.75rem 0.75rem 0 0;
    overflow: hidden;
  }

  /* ── HOVER LIFT ────────────────────────────────────────────────────── */
  .hover-lift {
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
  }
  .hover-lift:hover { transform: translateY(-4px); }

  /* ── BUTTON ACTIONS ────────────────────────────────────────────────── */
  .btn-action {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-action:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,.15) !important;
  }
  .btn-action:active { transform: none; }

  /* ── IMAGE DIV HEIGHTS ─────────────────────────────────────────────── */
  .chulapa-min-h-10 { min-height: 12rem; }
  @media (min-width: 576px) { .chulapa-min-h-10 { min-height: 10rem; } }

  /* ── Z-INDEX ───────────────────────────────────────────────────────── */
  .stretched-link::after { z-index: 1; }
  .z-index-2 { z-index: 2; position: relative; }

  /* ── CARD BODY LAYOUT (both viewports) ─────────────────────────────── */
  .post-card .card-body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── DESKTOP (≥992px) ──────────────────────────────────────────────── */
  @media (min-width: 992px) {
    .card-col { aspect-ratio: 1 / 1; }

    .post-card {
      background-size: cover;
      background-position: center;
      background-image: var(--card-bg-image, linear-gradient(135deg, #2c3e50, #3498db));
    }
    .post-card::before {
      background: rgba(0,0,0,.55);
      z-index: 0;
    }
    /* Image div is redundant on desktop — the card background IS the image */
    .post-card .chulapa-card-img { display: none !important; }

    .post-card .card-body {
      position: relative;
      z-index: 1;
      color: #fff;
      background: transparent;
      overflow-y: auto;
      scrollbar-width: thin;
      /*
       * FIX D: prevents a 6px content reflow when the scrollbar appears.
       * Without this, text inside the card shifts horizontally every time
       * a card becomes tall enough to need scrolling (e.g. on hover-lift
       * revealing more content).
       */
      scrollbar-gutter: stable;
    }

    /*
     * FIX C: scoped to `.post-card .card-body` instead of the global
     * `.card-body` selector.  The original rule styled the scrollbar of
     * every Bootstrap card-body on the entire page.
     */
    .post-card .card-body::-webkit-scrollbar       { width: 6px; }
    .post-card .card-body::-webkit-scrollbar-track { background: rgba(255,255,255,.2); border-radius: 10px; }
    .post-card .card-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.5); border-radius: 10px; }

    .post-card .card-title,
    .post-card .subtitle,
    .post-card .excerpt,
    .post-card .date             { color: #fff !important; }
    .post-card .card-title a     { color: #fff !important; }
    .post-card .subtitle         { color: rgba(255,255,255,.8) !important; }
    .post-card .excerpt          { color: rgba(255,255,255,.9) !important; }
    .post-card .border-top       { border-top-color: rgba(255,255,255,.3) !important; }
    .post-card .categories-badges .badge,
    .post-card .tags-badges .badge { color: #fff !important; }

    .post-card .badge {
      display: inline-block;
      background-color: rgba(0,0,0,.6);
      backdrop-filter: blur(2px);
    }
    .post-card .chulapa-pill-bg-secondary { background-color: rgba(108,117,125,.8); }
    .post-card .chulapa-pill-bg-primary   { background-color: rgba(13,110,253,.8);  }
  }

  /* ── MOBILE / TABLET (<992px) ──────────────────────────────────────── */
  @media (max-width: 991.98px) {
    /*
     * FIX E: was `.card { background-image: none !important }` — scoped to
     * `.post-card` so no other Bootstrap card on the page is affected.
     */
    .post-card { background-image: none !important; }
    .post-card::before { display: none; }

    .post-card .card-body {
      color: inherit;
      background: inherit;
      border-radius: 0 0 0.75rem 0.75rem;
    }
    .post-card .card-title,
    .post-card .subtitle,
    .post-card .excerpt,
    .post-card .date,
    .post-card .badge  { color: inherit !important; }
    .post-card .border-top { border-top-color: #dee2e6 !important; }

    .post-card .chulapa-card-img {
      display: block !important;
      border-radius: 0.75rem 0.75rem 0 0;
    }
  }
</style>
