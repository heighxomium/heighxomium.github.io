---
layout: default
---
{{ content }}

<!-- ── Skeleton loader (shown until JS fires) ────────────── -->
<div id="skeleton-grid" class="row g-3" aria-hidden="true">
  <div class="col-lg-4 col-md-6 col-12"><div class="lv-skeleton"></div></div>
  <div class="col-lg-4 col-md-6 col-12"><div class="lv-skeleton"></div></div>
  <div class="col-lg-4 col-md-6 col-12"><div class="lv-skeleton"></div></div>
</div>

<!-- ── Real posts grid ───────────────────────────────────── -->
<div id="posts-container" class="row g-3" style="display:none!important;"></div>

<!-- ── Progress label ────────────────────────────────────── -->
<p id="posts-progress" class="text-center lv-progress-text" style="display:none;"></p>

<!-- ── Load more / back to top ──────────────────────────── -->
<div id="loadmore-container" class="text-center mt-3 mb-5" style="display:none;">
  <button id="loadmore-btn" class="lv-btn lv-btn-load">
    <i class="fas fa-arrow-down me-2"></i>Load more posts
    <span class="lv-btn-spinner" id="loadmore-spinner" style="display:none;">
      <i class="fas fa-circle-notch fa-spin ms-2"></i>
    </span>
  </button>
</div>

<!-- ── Card template ─────────────────────────────────────── -->
<template id="card-template">
  <div class="col-lg-4 col-md-6 col-12 lv-card-col">
    <div class="lv-card position-relative overflow-hidden h-100">
      <!-- Image banner -->
      <div class="lv-img-banner image-col" style="background-size:cover;background-position:center;"></div>

      <!-- No-image accent bar (shown when image absent) -->
      <div class="lv-accent-bar" style="display:none;"></div>

      <!-- Content area -->
      <div class="lv-card-body d-flex flex-column">
        <div class="flex-grow-1">
          <a href="#" class="stretched-link title-link">
            <h5 class="lv-title card-title"></h5>
          </a>
          <p class="lv-subtitle subtitle"></p>
          <p class="lv-excerpt excerpt"></p>
        </div>

        <div class="lv-footer mt-auto pt-2">
          <div class="lv-date-row">
            <i class="fas fa-calendar-alt lv-date-icon"></i>
            <time class="date-time"></time>
          </div>
          <div class="lv-badges-row categories-badges"></div>
          <div class="lv-badges-row tags-badges"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  /* ── Helpers ────────────────────────────────────────────── */
  function getPostsPerPage() { return window.innerWidth >= 992 ? 15 : 10; }

  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/[&<>"']/g, m =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m])
    );
  }

  /* ── State ──────────────────────────────────────────────── */
  let currentPage = 1, currentPpp = getPostsPerPage(), isLoading = false;

  /* ── Embedded Liquid data ───────────────────────────────── */
  const allPosts = [
    {% assign collection = site[page.include_collection] %}
    {% if page.category_name %}
      {% assign posts_to_show = collection | where: "categories", page.category_name %}
    {% elsif page.tag_name %}
      {% assign posts_to_show = collection | where: "tags", page.tag_name %}
    {% else %}
      {% assign posts_to_show = collection %}
    {% endif %}
    {% for post in posts_to_show %}
      {% assign img = post.og_image | default: post.header_img %}
      {% if img %}{% assign img_abs = img | absolute_url %}{% else %}{% assign img_abs = nil %}{% endif %}
      {
        "title":      {{ post.title | jsonify }},
        "subtitle":   {{ post.subtitle | jsonify }},
        "date":       {{ post.date | date: "%d/%m/%Y" | jsonify }},
        "excerpt":    {{ post.excerpt | strip_html | truncate: 160 | jsonify }},
        "url":        {{ post.url | absolute_url | jsonify }},
        "og_image":   {{ img_abs | jsonify }},
        "categories": [{% for cat in post.categories %}{"name":{{ cat | jsonify }},"url":{{ cat | replace:" ","-" | prepend:"#" | prepend:post.cloudcategory_url | absolute_url | uri_escape | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],
        "tags":       [{% for tag in post.tags %}{"name":{{ tag | jsonify }},"url":{{ tag | replace:" ","-" | prepend:"#" | prepend:post.cloudtag_url | absolute_url | uri_escape | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  const totalPosts = allPosts.length;

  /* ── DOM refs ────────────────────────────────────────────── */
  const skeletonGrid    = document.getElementById('skeleton-grid');
  const container       = document.getElementById('posts-container');
  const loadmoreWrap    = document.getElementById('loadmore-container');
  const loadmoreBtn     = document.getElementById('loadmore-btn');
  const loadSpinner     = document.getElementById('loadmore-spinner');
  const progressEl      = document.getElementById('posts-progress');

  /* ── Render card ─────────────────────────────────────────── */
  function renderPost(post) {
    const tmpl  = document.getElementById('card-template');
    const clone = tmpl.content.cloneNode(true);

    clone.querySelector('.title-link').href = post.url;
    clone.querySelector('.card-title').textContent = post.title;

    const sub = clone.querySelector('.subtitle');
    if (post.subtitle) { sub.textContent = post.subtitle; } else { sub.remove(); }

    clone.querySelector('.excerpt').textContent = post.excerpt || '';

    const dateRow = clone.querySelector('.lv-date-row');
    if (post.date) {
      const t = clone.querySelector('.date-time');
      t.setAttribute('datetime', escapeHtml(post.date));
      t.textContent = escapeHtml(post.date);
    } else {
      dateRow.style.display = 'none';
    }

    const imgBanner  = clone.querySelector('.lv-img-banner');
    const accentBar  = clone.querySelector('.lv-accent-bar');
    if (post.og_image) {
      imgBanner.style.backgroundImage = `url('${escapeHtml(post.og_image)}')`;
    } else {
      imgBanner.style.display = 'none';
      accentBar.style.display = 'block';
    }

    const catWrap = clone.querySelector('.categories-badges');
    (post.categories || []).forEach(c => {
      const a = document.createElement('a');
      a.href = c.url; a.className = 'lv-badge lv-badge-cat position-relative'; a.style.zIndex='2';
      a.textContent = c.name; catWrap.appendChild(a);
    });

    const tagWrap = clone.querySelector('.tags-badges');
    (post.tags || []).forEach(t => {
      const a = document.createElement('a');
      a.href = t.url; a.className = 'lv-badge lv-badge-tag position-relative'; a.style.zIndex='2';
      a.textContent = t.name; tagWrap.appendChild(a);
    });

    return clone;
  }

  /* ── Update progress label ───────────────────────────────── */
  function updateProgress() {
    const loaded = Math.min(currentPage * currentPpp, totalPosts);
    progressEl.textContent = `Showing ${loaded} of ${totalPosts} posts`;
    progressEl.style.display = 'block';
  }

  /* ── Loading state toggle ────────────────────────────────── */
  function setLoading(state) {
    isLoading = state;
    loadmoreBtn.disabled = state;
    loadSpinner.style.display = state ? 'inline' : 'none';
  }

  /* ── Replace button with back-to-top ─────────────────────── */
  function replaceWithBackToTop() {
    loadmoreWrap.innerHTML = `
      <button id="backToTopBtn" class="lv-btn lv-btn-top">
        <i class="fas fa-arrow-up me-2"></i>Back to top
      </button>`;
    document.getElementById('backToTopBtn')
      .addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  }

  /* ── Load a batch ────────────────────────────────────────── */
  function loadMorePosts() {
    if (isLoading) return;
    setLoading(true);

    const start = (currentPage - 1) * currentPpp;
    const batch = allPosts.slice(start, start + currentPpp);

    if (!batch.length) { replaceWithBackToTop(); setLoading(false); return; }

    setTimeout(() => {
      const frag = document.createDocumentFragment();
      batch.forEach(post => {
        const node = renderPost(post);
        /* add enter class for animation */
        const col = node.querySelector('.lv-card-col');
        if (col) col.classList.add('lv-enter');
        frag.appendChild(node);
      });
      container.appendChild(frag);

      /* trigger enter animation next frame */
      requestAnimationFrame(() => {
        container.querySelectorAll('.lv-enter').forEach((el, i) => {
          setTimeout(() => el.classList.add('lv-entered'), i * 45);
        });
      });

      currentPage++;
      setLoading(false);
      updateProgress();
      if (currentPage * currentPpp >= totalPosts) replaceWithBackToTop();
    }, 200);
  }

  /* ── Init ────────────────────────────────────────────────── */
  function init() {
    /* swap skeleton → real grid */
    skeletonGrid.style.display = 'none';
    container.style.removeProperty('display');

    currentPpp  = getPostsPerPage();
    currentPage = 1;

    loadmoreWrap.style.display = totalPosts > currentPpp ? 'block' : 'none';
    loadMorePosts();
    loadmoreBtn.addEventListener('click', loadMorePosts);
  }

  /* ── Resize (debounced) ──────────────────────────────────── */
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      const n = getPostsPerPage();
      if (n !== currentPpp) {
        currentPpp = n;
        if (loadmoreWrap.querySelector('#loadmore-btn'))
          loadmoreWrap.style.display = currentPage * currentPpp < totalPosts ? 'block' : 'none';
      }
    }, 250);
  });

  document.addEventListener('DOMContentLoaded', init);
</script>

<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════════════ */
:root {
  --lv-surface:    var(--chulapa-color-bg-1, #fff);
  --lv-border:     rgba(0,0,0,0.08);
  --lv-gold:       #f59f00;
  --lv-gold-dim:   rgba(245,159,0,.15);
  --lv-radius:     .9rem;
  --lv-img-h:      140px;
}

/* ═══════════════════════════════════════════════════════════
   SKELETON LOADER
═══════════════════════════════════════════════════════════ */
@keyframes lv-shimmer {
  from { background-position: -300% center; }
  to   { background-position:  300% center; }
}
.lv-skeleton {
  height: 220px;
  border-radius: var(--lv-radius);
  background: linear-gradient(90deg,
    rgba(128,128,128,.08) 25%,
    rgba(128,128,128,.18) 50%,
    rgba(128,128,128,.08) 75%);
  background-size: 300% 100%;
  animation: lv-shimmer 1.6s ease-in-out infinite;
}

/* ═══════════════════════════════════════════════════════════
   CARD
═══════════════════════════════════════════════════════════ */
/* Entry animation */
.lv-card-col.lv-enter   { opacity:0; transform:translateY(14px); }
.lv-card-col.lv-entered { opacity:1; transform:translateY(0);
                          transition: opacity .4s ease, transform .4s ease; }

.lv-card {
  border-radius: var(--lv-radius);
  border: 1px solid var(--lv-border);
  background: var(--lv-surface);
  display: flex;
  flex-direction: column;
  transition: transform .25s ease, box-shadow .25s ease;
}
.lv-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.12);
}

/* Hover shimmer overlay */
.lv-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--lv-radius);
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.04) 60%, transparent 80%);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}
.lv-card:hover::after { opacity: 1; }

/* ── Image banner (top, full-width) ─────────────────────── */
.lv-img-banner {
  width: 100%;
  height: var(--lv-img-h);
  border-radius: var(--lv-radius) var(--lv-radius) 0 0;
  position: relative;
  flex-shrink: 0;
  background-color: rgba(128,128,128,.08);
}
/* gradient fade at bottom of image */
.lv-img-banner::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 55%;
  background: linear-gradient(to top, var(--lv-surface), transparent);
  border-radius: 0;
}

/* ── Accent bar (fallback when no image) ─────────────────── */
.lv-accent-bar {
  height: 4px;
  background: linear-gradient(90deg, var(--lv-gold), #4dabf7, #da77f2);
  border-radius: var(--lv-radius) var(--lv-radius) 0 0;
  flex-shrink: 0;
}

/* ── Card body ───────────────────────────────────────────── */
.lv-card-body {
  padding: .9rem 1rem 1rem;
  flex: 1;
}

/* ── Title ───────────────────────────────────────────────── */
.lv-title {
  font-size: .97rem;
  font-weight: 700;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: .3rem;
  transition: color .2s;
}
.lv-card:hover .lv-title { color: var(--lv-gold); }

/* ── Subtitle ────────────────────────────────────────────── */
.lv-subtitle {
  font-size: .76rem;
  opacity: .6;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: .45rem;
}

/* ── Excerpt ─────────────────────────────────────────────── */
.lv-excerpt {
  font-size: .8rem;
  line-height: 1.6;
  opacity: .72;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 0;
}

/* ── Footer ──────────────────────────────────────────────── */
.lv-footer {
  border-top: 1px solid var(--lv-border);
  padding-top: .6rem;
  margin-top: .6rem;
}
.lv-date-row {
  display: flex;
  align-items: center;
  gap: .35rem;
  font-size: .72rem;
  opacity: .55;
  font-style: italic;
  margin-bottom: .45rem;
}
.lv-date-icon { font-size: .65rem; }

/* ── Badges ──────────────────────────────────────────────── */
.lv-badges-row {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem;
  margin-bottom: .2rem;
}
.lv-badge {
  font-size: .68rem;
  font-weight: 600;
  padding: .2rem .6rem;
  border-radius: 50px;
  text-decoration: none;
  transition: opacity .2s;
}
.lv-badge:hover { opacity: .78; }
.lv-badge-cat {
  background: rgba(245,159,0,.12);
  color: var(--lv-gold);
  border: 1px solid rgba(245,159,0,.3);
}
.lv-badge-tag {
  background: rgba(77,171,247,.1);
  color: #4dabf7;
  border: 1px solid rgba(77,171,247,.25);
}

/* ── Stretched link z-index fix ──────────────────────────── */
.stretched-link::after { z-index: 1; }
.lv-badge, .lv-card-body a { z-index: 2; position: relative; }

/* ═══════════════════════════════════════════════════════════
   PROGRESS TEXT
═══════════════════════════════════════════════════════════ */
.lv-progress-text {
  font-size: .78rem;
  opacity: .5;
  letter-spacing: .04em;
  margin-top: .25rem;
}

/* ═══════════════════════════════════════════════════════════
   ACTION BUTTONS
═══════════════════════════════════════════════════════════ */
.lv-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 50px;
  font-weight: 700;
  font-size: .88rem;
  letter-spacing: .04em;
  padding: .65rem 2.2rem;
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease, background .2s;
  min-width: 200px;
}
.lv-btn:hover { transform: translateY(-3px); }

.lv-btn-load {
  background: var(--lv-gold);
  color: #1a1a1a;
  box-shadow: 0 4px 18px var(--lv-gold-dim);
}
.lv-btn-load:hover {
  background: #f08c00;
  box-shadow: 0 8px 28px rgba(245,159,0,.4);
}
.lv-btn-load:disabled { opacity: .7; cursor: default; transform: none; }

.lv-btn-top {
  background: transparent;
  color: currentColor;
  border: 1px solid var(--lv-border);
  box-shadow: none;
}
.lv-btn-top:hover {
  box-shadow: 0 4px 14px rgba(0,0,0,.12);
  border-color: rgba(0,0,0,.2);
}

/* ── Full-width on phones ────────────────────────────────── */
@media (max-width: 575.98px) {
  .lv-btn { width: 100%; min-width: unset; }
  .lv-img-banner { height: 110px; }
}
</style>
