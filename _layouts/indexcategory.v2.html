---
layout: default
---
{{ content }}

<div id="posts-container" class="row">
  <div class="col-12 text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Loading…</span>
    </div>
  </div>
</div>

<div id="loadmore-container" class="text-center mt-4 mb-5" style="display: none;">
  <button id="loadmore-btn" class="btn btn-primary btn-lg px-5 py-2 rounded-pill shadow-sm">
    <i class="fas fa-arrow-down mr-2"></i> Load more posts
    <i class="fas fa-spinner fa-pulse d-none ml-2" id="loadmore-spinner"></i>
  </button>
</div>

<template id="card-template">
  <div class="col-lg-4 col-md-6 col-12 mb-2">
    <div class="card chulapa-border-card-index rounded-4 shadow-sm h-100 position-relative overflow-hidden">
      <div class="row g-0">
        <div class="col-sm-1 chulapa-min-h-10 chulapa-card-img chulapa-overlay-img chulapa-gradient image-col"
             style="background-size: cover; background-position: center;">
        </div>
        <div class="col-sm">
          <article class="card-body chulapa-links-hover-only">
            <a href="#" class="stretched-link title-link"><h5 class="card-title"></h5></a>
            <h6 class="card-subtitle mb-2 text-muted subtitle"></h6>
            <div class="card-text mb-3 excerpt"></div>
          </article>
          <div class="border-top-0 card-footer border-primary chulapa-bg-transparent mt-2">
            <p class="small text-right font-italic mb-1 date"></p>
            <div class="categories-badges"></div>
            <div class="tags-badges"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  // ----- Helper: get posts per page based on screen width -----
  function getPostsPerPage() {
    // Desktop: width >= 992px (Bootstrap's lg breakpoint)
    if (window.innerWidth >= 992) {
      return 15;
    } else {
      // Mobile / tablet: 10 posts
      return 10;
    }
  }

  let currentPage = 1;
  let currentPostsPerPage = getPostsPerPage();
  let allPosts = [];
  let isLoading = false;

  // ----- EMBEDDED POSTS DATA (absolute image URLs) -----
  const allPostsData = [
    {% assign collection = site[page.include_collection] %}
    {% if page.category_name %}
      {% assign posts_to_show = collection | where: "categories", page.category_name %}
    {% elsif page.tag_name %}
      {% assign posts_to_show = collection | where: "tags", page.tag_name %}
    {% else %}
      {% assign posts_to_show = collection %}
    {% endif %}
    
    {% for post in posts_to_show %}
      {% assign img = post.og_image | default: post.header_img %}
      {% if img %}
        {% assign img_abs = img | absolute_url %}
      {% else %}
        {% assign img_abs = nil %}
      {% endif %}
      
      {
        "title": {{ post.title | jsonify }},
        "subtitle": {{ post.subtitle | jsonify }},
        "date": {{ post.date | date: "%d/%m/%Y" | jsonify }},
        "excerpt": {{ post.excerpt | strip_html | jsonify }},
        "url": {{ post.url | absolute_url | jsonify }},
        "og_image": {{ img_abs | jsonify }},
        "categories": [
          {% for cat in post.categories %}
            { "name": {{ cat | jsonify }}, "url": {{ cat | replace: " ", "-" | prepend: "#" | prepend: post.cloudcategory_url | absolute_url | uri_escape | jsonify }} }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ],
        "tags": [
          {% for tag in post.tags %}
            { "name": {{ tag | jsonify }}, "url": {{ tag | replace: " ", "-" | prepend: "#" | prepend: post.cloudtag_url | absolute_url | uri_escape | jsonify }} }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ]
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  allPosts = allPostsData;
  const totalPosts = allPosts.length;

  // DOM elements
  const container = document.getElementById('posts-container');
  const loadmoreContainer = document.getElementById('loadmore-container');
  const loadmoreBtn = document.getElementById('loadmore-btn');
  const btnSpinner = document.getElementById('loadmore-spinner');

  // Helper: escape HTML
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Render a single post using the template
  function renderPost(post) {
    const template = document.getElementById('card-template');
    const clone = template.content.cloneNode(true);
    
    const titleLink = clone.querySelector('.title-link');
    titleLink.href = post.url;
    titleLink.querySelector('.card-title').textContent = post.title;
    
    const subtitleEl = clone.querySelector('.subtitle');
    if (post.subtitle && post.subtitle !== "") {
      subtitleEl.textContent = post.subtitle;
    } else {
      subtitleEl.style.display = 'none';
    }
    
    clone.querySelector('.excerpt').textContent = post.excerpt;
    
    const dateEl = clone.querySelector('.date');
    if (post.date) {
      dateEl.innerHTML = `<time datetime="${escapeHtml(post.date)}">${escapeHtml(post.date)}</time>`;
    } else {
      dateEl.parentElement.style.display = 'none';
    }
    
    const imageCol = clone.querySelector('.image-col');
    if (post.og_image && post.og_image !== "") {
      imageCol.style.backgroundImage = `url('${escapeHtml(post.og_image)}')`;
      imageCol.classList.remove('d-none');
    } else {
      imageCol.classList.add('d-none', 'd-sm-flex');
      imageCol.style.backgroundImage = '';
    }
    
    const catContainer = clone.querySelector('.categories-badges');
    if (post.categories && post.categories.length) {
      post.categories.forEach(cat => {
        const badge = document.createElement('a');
        badge.href = cat.url;
        badge.className = 'badge chulapa-pill-bg-secondary mx-1 position-relative';
        badge.style.zIndex = '2';
        badge.textContent = cat.name;
        catContainer.appendChild(badge);
      });
    }
    
    const tagContainer = clone.querySelector('.tags-badges');
    if (post.tags && post.tags.length) {
      post.tags.forEach(tag => {
        const badge = document.createElement('a');
        badge.href = tag.url;
        badge.className = 'badge chulapa-pill-bg-primary mx-1 position-relative';
        badge.style.zIndex = '2';
        badge.textContent = tag.name;
        tagContainer.appendChild(badge);
      });
    }
    
    return clone;
  }

  // Load more posts (respects current posts per page)
  function loadMorePosts() {
    if (isLoading) return;
    isLoading = true;
    
    if (btnSpinner && loadmoreBtn) {
      btnSpinner.classList.remove('d-none');
      loadmoreBtn.disabled = true;
    }
    
    const start = (currentPage - 1) * currentPostsPerPage;
    const end = start + currentPostsPerPage;
    const postsToLoad = allPosts.slice(start, end);
    
    if (postsToLoad.length === 0) {
      replaceWithBackToTop();
      isLoading = false;
      return;
    }
    
    setTimeout(() => {
      postsToLoad.forEach(post => {
        const card = renderPost(post);
        container.appendChild(card);
      });
      currentPage++;
      isLoading = false;
      if (btnSpinner) btnSpinner.classList.add('d-none');
      if (loadmoreBtn) loadmoreBtn.disabled = false;
      
      // Check if all posts are loaded
      if (currentPage * currentPostsPerPage >= totalPosts) {
        replaceWithBackToTop();
      }
    }, 200);
  }

  // Replace Load More button with Back to Top
  function replaceWithBackToTop() {
    if (!loadmoreContainer) return;
    loadmoreContainer.innerHTML = `
      <button id="backToTopBtn" class="btn btn-secondary btn-lg px-5 py-2 rounded-pill shadow-sm">
        Back to top
      </button>
    `;
    const backBtn = document.getElementById('backToTopBtn');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  }

  // Initialise the page
  function init() {
    // Clear spinner
    container.innerHTML = '';
    
    // Determine posts per page based on current screen width
    currentPostsPerPage = getPostsPerPage();
    currentPage = 1;
    
    // Show/hide load more button
    if (totalPosts <= currentPostsPerPage) {
      loadmoreContainer.style.display = 'none';
    } else {
      loadmoreContainer.style.display = 'block';
    }
    
    // Load first batch
    loadMorePosts();
    
    // Attach event listener to button (if not already)
    if (loadmoreBtn) {
      loadmoreBtn.addEventListener('click', loadMorePosts);
    }
  }
  
  // Run init on load and also on window resize (optional, but resets view)
  // Resetting on resize could be confusing; we'll just re-init if size crosses threshold?
  // Simpler: do nothing on resize. The page works with whichever size it loaded.
  document.addEventListener('DOMContentLoaded', init);
</script>

<style>
  .rounded-4 { border-radius: 0.75rem !important; }
  .stretched-link::after { z-index: 1; }
  .position-relative { position: relative; }
  .card-footer a.badge,
  .card-footer a.badge:hover { z-index: 2; position: relative; }
  #loadmore-btn, #backToTopBtn {
    border-radius: 50px !important;
    transition: all 0.3s ease;
  }
  #loadmore-btn:hover, #backToTopBtn:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  .chulapa-min-h-10 { min-height: 10rem; }
  @media (min-width: 576px) {
    .chulapa-min-h-10 { min-height: 80px; }
  }
</style>
