---
layout: default
---
{{ content }}

<div class="row">
  <div id="posts-container" class="col-12">
    <!-- Loading spinner -->
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading…</span>
      </div>
    </div>
  </div>
</div>

<div id="loadmore-container" class="text-center mt-4 mb-5" style="display: none;">
  <button id="loadmore-btn" class="btn btn-primary btn-lg px-5 py-2 rounded-pill shadow-sm">
    <i class="fas fa-arrow-down mr-2"></i> Load more posts
    <i class="fas fa-spinner fa-pulse d-none ml-2" id="loadmore-spinner"></i>
  </button>
</div>

<script>
  // Configuration
  const POSTS_PER_PAGE = {{ page.posts_per_page | default: 10 }};
  let currentPage = 1;
  let allPosts = [];
  let isLoading = false;

  // Build posts data (exactly as Jekyll would for indexcards.html)
  const allPostsData = [
    {% assign collection = site[page.include_collection] %}
    {% if page.category_name %}
      {% assign posts_to_show = collection | where: "categories", page.category_name %}
    {% elsif page.tag_name %}
      {% assign posts_to_show = collection | where: "tags", page.tag_name %}
    {% else %}
      {% assign posts_to_show = collection %}
    {% endif %}
    
    {% for post in posts_to_show %}
      {
        "title": {{ post.title | jsonify }},
        "subtitle": {{ post.subtitle | jsonify }},
        "date": {{ post.date | date: "%d/%m/%Y" | jsonify }},
        "excerpt": {{ post.excerpt | strip_html | jsonify }},
        "url": {{ post.url | absolute_url | jsonify }},
        "og_image": {{ post.og_image | default: post.header_img | jsonify }},
        "categories": [
          {% for cat in post.categories %}
            "{{ cat | slugify | prepend: '#' | prepend: post.cloudcategory_url | absolute_url | uri_escape }}",
          {% endfor %}
        ],
        "category_names": [{% for cat in post.categories %}"{{ cat }}"{% unless forloop.last %},{% endunless %}{% endfor %}],
        "tags": [
          {% for tag in post.tags %}
            "{{ tag | slugify | prepend: '#' | prepend: post.cloudtag_url | absolute_url | uri_escape }}",
          {% endfor %}
        ],
        "tag_names": [{% for tag in post.tags %}"{{ tag }}"{% unless forloop.last %},{% endunless %}{% endfor %}]
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  allPosts = allPostsData;
  
  const container = document.getElementById('posts-container');
  container.innerHTML = '';

  const totalPosts = allPosts.length;
  if (totalPosts <= POSTS_PER_PAGE) {
    document.getElementById('loadmore-container').style.display = 'none';
  }

  loadMorePosts();

  function loadMorePosts() {
    if (isLoading) return;
    isLoading = true;
    
    const btnSpinner = document.getElementById('loadmore-spinner');
    const btn = document.getElementById('loadmore-btn');
    if (btnSpinner && btn) {
      btnSpinner.classList.remove('d-none');
      btn.disabled = true;
    }

    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const end = start + POSTS_PER_PAGE;
    const postsToLoad = allPosts.slice(start, end);

    if (postsToLoad.length === 0) {
      replaceWithBackToTop();
      isLoading = false;
      return;
    }

    setTimeout(() => {
      postsToLoad.forEach(post => {
        // Build the exact HTML from indexcards.html
        let imageBlock = '';
        if (post.og_image) {
          imageBlock = `
            <a href="${escapeHtml(post.url)}" class="col-sm-1 chulapa-min-h-10 chulapa-card-img chulapa-overlay-img chulapa-gradient"
               style="background-image: url('${escapeHtml(post.og_image)}')">
            </a>
          `;
        } else {
          // No image: class "d-none d-sm-flex" is removed? In original, they add "d-none d-sm-flex" if no image.
          // We'll keep the column but without background, and hide on small? Better to replicate: 
          // The original adds class "d-none d-sm-flex" when no image. We'll do the same.
          imageBlock = `
            <div class="col-sm-1 d-none d-sm-flex"></div>
          `;
        }

        // Build categories badges
        let categoriesHtml = '';
        if (post.category_names && post.category_names.length) {
          categoriesHtml = post.category_names.map((cat, idx) => {
            let catUrl = post.categories[idx] || '#';
            return `<a href="${escapeHtml(catUrl)}" class="badge chulapa-pill-bg-secondary mx-1">${escapeHtml(cat)}</a>`;
          }).join('');
        }

        // Build tags badges
        let tagsHtml = '';
        if (post.tag_names && post.tag_names.length) {
          tagsHtml = post.tag_names.map((tag, idx) => {
            let tagUrl = post.tags[idx] || '#';
            return `<a href="${escapeHtml(tagUrl)}" class="badge chulapa-pill-bg-primary mx-1">${escapeHtml(tag)}</a>`;
          }).join('');
        }

        const cardHtml = `
          <div class="col-12 mb-2">
            <div class="card chulapa-border-card-index">
              <div class="row g-0">
                ${imageBlock}
                <div class="col-sm">
                  <article class="card-body chulapa-links-hover-only">
                    <a href="${escapeHtml(post.url)}"><h5 class="card-title">${escapeHtml(post.title)}</h5></a>
                    ${post.subtitle ? `<h6 class="card-subtitle mb-2 text-muted">${escapeHtml(post.subtitle)}</h6>` : ''}
                    <div class="card-text">${escapeHtml(post.excerpt)}</div>
                  </article>
                  <div class="border-top-0 card-footer border-primary chulapa-bg-transparent">
                    ${post.date ? `<p class="small text-right font-italic mb-1"><time datetime="${escapeHtml(post.date)}">${escapeHtml(post.date)}</time></p>` : ''}
                    ${categoriesHtml}
                    ${tagsHtml}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });

      currentPage++;
      isLoading = false;
      if (btnSpinner) btnSpinner.classList.add('d-none');
      if (btn) btn.disabled = false;

      if (currentPage > Math.ceil(totalPosts / POSTS_PER_PAGE)) {
        replaceWithBackToTop();
      }
    }, 200);
  }

  function replaceWithBackToTop() {
    const btnContainer = document.getElementById('loadmore-container');
    if (!btnContainer) return;
    
    btnContainer.innerHTML = `
      <button id="backToTopBtn" class="btn btn-secondary btn-lg px-5 py-2 rounded-pill shadow-sm">
        Back to top
      </button>
    `;
    
    const backBtn = document.getElementById('backToTopBtn');
    if (backBtn) {
      backBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('loadmore-btn');
    if (btn) btn.addEventListener('click', loadMorePosts);
  });
</script>
