---
layout: default
---
{{ content }}

<div class="container px-lg-3">
  <div id="posts-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-2 g-4">
    <div class="col-12 text-center py-5" id="initial-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading posts…</span>
      </div>
    </div>
  </div>

  <!-- aria-live so screen readers announce button swaps -->
  <div id="loadmore-container"
       class="d-flex justify-content-center mt-5 mb-5"
       style="display:none;"
       aria-live="polite">
    <button id="loadmore-btn"
            class="btn btn-primary btn-lg px-5 py-2 rounded-4 shadow-sm btn-action"
            aria-label="Load more posts">
      <i class="fas fa-arrow-down me-2" aria-hidden="true"></i>Load more posts
      <i class="fas fa-spinner fa-pulse d-none ms-2" id="loadmore-spinner" aria-hidden="true"></i>
    </button>
  </div>
</div>

<template id="card-template">
  <!-- mb-4 removed: .g-4 on the row already provides the correct gutter -->
  <div class="col card-col">
    <div class="card chulapa-border-card-index rounded-4 shadow-sm h-100 position-relative overflow-hidden hover-lift">
      <!-- role="img" + dynamic aria-label set in JS -->
      <div class="chulapa-min-h-10 chulapa-card-img chulapa-overlay-img"
           style="background-size:cover;background-position:center;"
           role="img"
           aria-label="Post thumbnail"></div>
      <div class="card-body d-flex flex-column flex-grow-1 overflow-auto position-relative">
        <article class="flex-grow-1">
          <a href="#" class="stretched-link title-link text-decoration-none">
            <h5 class="card-title fw-bold mb-2"></h5>
          </a>
          <h6 class="card-subtitle mb-2 text-muted subtitle"></h6>
          <div class="card-text mb-3 excerpt text-secondary small"></div>
        </article>
        <div class="border-top pt-3 mt-auto">
          <!-- date is its own <p>; hiding it no longer nukes the badge rows -->
          <p class="small text-end fst-italic mb-2 date"></p>
          <div class="categories-badges mb-2"></div>
          <div class="tags-badges"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
(function () {
  'use strict';

  // ── CONFIGURATION ──────────────────────────────────────────────────────
  const POSTS_PER_PAGE_DESKTOP = 12;
  const POSTS_PER_PAGE_MOBILE  = 10;
  const BREAKPOINT_LG          = 992;

  // ── DOM REFS ────────────────────────────────────────────────────────────
  const cardTemplate      = document.getElementById('card-template');
  const container         = document.getElementById('posts-container');
  const loadmoreContainer = document.getElementById('loadmore-container');
  const loadmoreBtn       = document.getElementById('loadmore-btn');
  const btnSpinner        = document.getElementById('loadmore-spinner');
  const initialSpinner    = document.getElementById('initial-spinner');

  // ── STATE ───────────────────────────────────────────────────────────────
  // FIX #2 & #7: replace currentPage*perPage arithmetic with a flat counter.
  // renderedCount is viewport-agnostic: resize never misaligns the next batch.
  let renderedCount       = 0;
  let currentPostsPerPage = getPostsPerPage();
  let isLoading           = false;

  // ── LIQUID DATA ─────────────────────────────────────────────────────────
  // FIX #1: the console.warn for a missing collection MUST live here, outside
  // the array literal.  Inside the literal it becomes a call-expression that
  // evaluates to `undefined`, silently prepending a corrupt element to the array.
  {%- assign collection = site[page.include_collection] -%}
  {%- unless collection %}
  console.warn("indexcategory: collection '{{ page.include_collection }}' not found.");
  {%- endunless -%}

  {%- assign default_img = site.default_header_image | absolute_url -%}
  {%- if page.category_name -%}
    {%- assign posts_to_show = collection | where: "categories", page.category_name -%}
  {%- elsif page.tag_name -%}
    {%- assign posts_to_show = collection | where: "tags", page.tag_name -%}
  {%- else -%}
    {%- assign posts_to_show = collection -%}
  {%- endif -%}

  let allPosts = [];
  try {
    allPosts = [
      {%- for post in posts_to_show -%}
        {%- capture img -%}
          {%- if post.og_image    -%}{{ post.og_image    | absolute_url }}
          {%- elsif post.header_img -%}{{ post.header_img  | absolute_url }}
          {%- elsif default_img != "" -%}{{ default_img }}
          {%- endif -%}
        {%- endcapture -%}
        {%- assign img_clean = img | strip -%}
        {
          "title":      {{ post.title    | jsonify }},
          "subtitle":   {{ post.subtitle | jsonify }},
          "date":       {{ post.date | date: "%d/%m/%Y" | jsonify }},
          "excerpt":    {{ post.excerpt | strip_html | truncatewords: 20 | jsonify }},
          "url":        {{ post.url | absolute_url | jsonify }},
          "og_image":   {% if img_clean != "" %}{{ img_clean | jsonify }}{% else %}null{% endif %},
          "categories": [
            {%- for cat in post.categories -%}
              { "name": {{ cat | jsonify }},
                "url":  {{ cat | replace: " ", "-" | prepend: "#" | prepend: post.cloudcategory_url | absolute_url | uri_escape | jsonify }}
              }{% unless forloop.last %},{% endunless %}
            {%- endfor -%}
          ],
          "tags": [
            {%- for tag in post.tags -%}
              { "name": {{ tag | jsonify }},
                "url":  {{ tag | replace: " ", "-" | prepend: "#" | prepend: post.cloudtag_url | absolute_url | uri_escape | jsonify }}
              }{% unless forloop.last %},{% endunless %}
            {%- endfor -%}
          ]
        }{% unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ];
  } catch (e) {
    console.error('Failed to parse Liquid posts data:', e);
  }

  const totalPosts = allPosts.length;

  // ── UTILITIES ───────────────────────────────────────────────────────────

  function getPostsPerPage() {
    return window.innerWidth >= BREAKPOINT_LG
      ? POSTS_PER_PAGE_DESKTOP
      : POSTS_PER_PAGE_MOBILE;
  }

  /**
   * FIX #4: Escape characters unsafe inside a CSS url("…") string.
   * Per the CSS spec only U+0022 (") and U+005C (\) need escaping inside
   * a double-quoted url token.  escapeHtml is WRONG here — &amp; inside
   * url("...") corrupts the URL rather than protecting it.
   */
  function cssUrlEscape(url) {
    return url.replace(/["\\]/g, ch => (ch === '\\' ? '\\\\' : '\\"'));
  }

  /**
   * FIX #6: Full set of HTML special characters including quotes.
   * Original missed " and ' — incomplete XSS protection for attribute contexts.
   */
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, ch => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));
  }

  function debounce(fn, ms) {
    let t;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  /** Idempotent: safe to call after the node has already been removed. */
  function removeInitialSpinner() {
    if (initialSpinner && initialSpinner.parentNode) initialSpinner.remove();
  }

  // ── UI HELPERS ──────────────────────────────────────────────────────────

  function showEmptyState() {
    removeInitialSpinner();
    const el = document.createElement('div');
    el.className = 'col-12 text-center py-5';
    el.innerHTML = '<p class="lead text-muted">No posts found.</p>';
    container.appendChild(el);
  }

  function showError(msg) {
    removeInitialSpinner();
    const el = document.createElement('div');
    el.className = 'col-12 text-center py-5 alert alert-danger';
    el.textContent = 'Error loading posts: ' + msg; // textContent prevents XSS
    container.appendChild(el);
  }

  function setButtonLoading(on) {
    if (loadmoreBtn) loadmoreBtn.disabled = on;
    if (btnSpinner)  btnSpinner.classList.toggle('d-none', !on);
  }

  /**
   * Swap "Load more" for "Back to top" inside loadmoreContainer.
   * FIX #3 & #9: does NOT touch container visibility — that is the caller's
   * responsibility.  Uses a scoped querySelector instead of a global ID so
   * the selector cannot collide with other page elements.
   */
  function replaceWithBackToTop() {
    if (!loadmoreContainer) return;
    loadmoreContainer.innerHTML = `
      <button class="btn btn-secondary btn-lg px-5 py-2 rounded-4 shadow-sm btn-action"
              aria-label="Scroll back to top">
        <i class="fas fa-arrow-up me-2" aria-hidden="true"></i>Back to top
      </button>`;
    loadmoreContainer.querySelector('button')
      ?.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  }

  // ── RENDERING ───────────────────────────────────────────────────────────

  function renderPost(post) {
    const clone    = cardTemplate.content.cloneNode(true);
    const card     = clone.querySelector('.card');
    const imageDiv = clone.querySelector('.chulapa-card-img');
    const hasImage = typeof post.og_image === 'string' && post.og_image.length > 0;

    // Desktop: card background via CSS custom property.
    // cssUrlEscape is mandatory here — escapeHtml would corrupt the URL.
    card.style.setProperty(
      '--card-bg-image',
      hasImage
        ? `url("${cssUrlEscape(post.og_image)}")`
        : 'linear-gradient(135deg, #2c3e50, #3498db)'
    );

    // Mobile: dedicated image div (hidden on desktop via CSS).
    if (hasImage) {
      // FIX #4: cssUrlEscape, not escapeHtml, for CSS url() values.
      imageDiv.style.backgroundImage = `url("${cssUrlEscape(post.og_image)}")`;
      imageDiv.setAttribute('aria-label', escapeHtml(post.title || '') + ' thumbnail');
    } else {
      imageDiv.hidden = true;
    }

    // Title + link
    const titleLink = clone.querySelector('.title-link');
    titleLink.href  = post.url || '#';
    titleLink.querySelector('.card-title').textContent = post.title || '(Untitled)';

    // Subtitle
    const subtitleEl = clone.querySelector('.subtitle');
    if (post.subtitle) {
      subtitleEl.textContent = post.subtitle;
    } else {
      subtitleEl.hidden = true;
    }

    // Excerpt
    clone.querySelector('.excerpt').textContent = post.excerpt || '';

    // FIX #5: hide only the <p class="date">, not its parent .border-top.
    // The original hid the entire footer strip, destroying categories + tags.
    const dateEl = clone.querySelector('.date');
    if (post.date) {
      const safe = escapeHtml(post.date);
      // Note: datetime should ideally be ISO-8601 (YYYY-MM-DD) for machine
      // readability.  Requires a second Liquid date format pass if desired.
      dateEl.innerHTML =
        `<time datetime="${safe}">` +
        `<i class="far fa-calendar-alt me-1" aria-hidden="true"></i>${safe}` +
        `</time>`;
    } else {
      dateEl.hidden = true;
    }

    // Category badges
    const catContainer = clone.querySelector('.categories-badges');
    for (const cat of (post.categories || [])) {
      const a = document.createElement('a');
      a.href        = cat.url  || '#';
      a.className   = 'badge chulapa-pill-bg-secondary me-1 mb-1 z-index-2';
      a.textContent = cat.name || '';
      catContainer.appendChild(a);
    }

    // Tag badges
    const tagContainer = clone.querySelector('.tags-badges');
    for (const tag of (post.tags || [])) {
      const a = document.createElement('a');
      a.href        = tag.url  || '#';
      a.className   = 'badge chulapa-pill-bg-primary me-1 mb-1 z-index-2';
      a.textContent = tag.name || '';
      tagContainer.appendChild(a);
    }

    return clone;
  }

  // ── LOAD MORE ───────────────────────────────────────────────────────────

  function loadMorePosts() {
    if (isLoading) return;
    isLoading = true;
    setButtonLoading(true);

    // FIX #2: slice directly from renderedCount — no page × perPage arithmetic,
    // no off-by-one, immune to perPage changes between calls (FIX #7).
    const batch = allPosts.slice(renderedCount, renderedCount + currentPostsPerPage);

    const fragment = document.createDocumentFragment();
    for (const post of batch) {
      try {
        fragment.appendChild(renderPost(post));
      } catch (err) {
        console.error('Failed to render post:', err, post);
      }
    }
    container.appendChild(fragment); // single reflow
    removeInitialSpinner();

    renderedCount += batch.length;
    isLoading = false;
    setButtonLoading(false);

    // FIX #3: only swap in back-to-top when the container is already visible,
    // meaning the user triggered at least one extra load beyond the first page.
    // When called from init() the container is still display:none, so this
    // branch is correctly skipped and the container stays hidden.
    if (renderedCount >= totalPosts && loadmoreContainer.style.display !== 'none') {
      replaceWithBackToTop();
    }
  }

  // ── INIT ────────────────────────────────────────────────────────────────

  function init() {
    if (!cardTemplate)      { showError('Card template element missing.');    return; }
    if (!container)         { console.error('Posts container missing.');      return; }
    if (!loadmoreContainer) { console.error('Load-more container missing.');  return; }
    if (totalPosts === 0)   { showEmptyState();                               return; }

    currentPostsPerPage = getPostsPerPage();

    // First load runs with loadmoreContainer at display:none (set in HTML).
    // This intentionally prevents replaceWithBackToTop from firing when all
    // posts fit in one page — there is nothing to scroll back to.
    loadMorePosts();

    // Only reveal the load-more button if posts remain after the first batch.
    if (renderedCount < totalPosts) {
      loadmoreContainer.style.display = 'flex';
      loadmoreBtn?.addEventListener('click', loadMorePosts);
    }
  }

  // FIX #7: renderedCount is viewport-agnostic; updating perPage is enough.
  // The next click will simply continue from the correct offset regardless of
  // how many times the user resizes.
  window.addEventListener('resize', debounce(() => {
    currentPostsPerPage = getPostsPerPage();
  }, 200));

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}());
</script>

<style>
  /* ── GLOBAL ──────────────────────────────────────────────────────────── */
  .visually-hidden {
    position: absolute !important;
    width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0,0,0,0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  .rounded-4 { border-radius: 0.75rem !important; }

  /* ── CARD ────────────────────────────────────────────────────────────── */
  .card {
    border-radius: 0.75rem;
    overflow: hidden;             /* clips child content to the rounded corners  */
    background-clip: padding-box; /* prevents background from bleeding past border */
    /* FIX #8: removed transform:translateZ(0), backface-visibility:hidden,
       and will-change:transform — GPU-promotion hints have real memory cost
       and are unnecessary for a simple translateY hover on static cards.     */
  }

  /* Dark overlay (desktop only — enabled in @media below) */
  .card::before {
    content: '';
    position: absolute; inset: 0;
    /* Explicit radius must match .card exactly to prevent subpixel bleed in
       Safari when overflow:hidden and border-radius interact with compositing. */
    border-radius: 0.75rem;
    pointer-events: none;
  }

  .chulapa-card-img {
    border-radius: 0.75rem 0.75rem 0 0;
    overflow: hidden;
  }

  /* ── HOVER LIFT ──────────────────────────────────────────────────────── */
  .hover-lift {
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
  }
  .hover-lift:hover { transform: translateY(-4px); }

  /* ── BUTTONS ─────────────────────────────────────────────────────────── */
  /* FIX #9: class-based selector replaces the #backToTopBtn ID selector.
     The back-to-top button is created dynamically; an ID selector worked
     only by luck and would break if the ID was ever reused on the page.  */
  .btn-action {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-action:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,.15) !important;
  }
  .btn-action:active { transform: none; }

  /* ── IMAGE HEIGHTS ───────────────────────────────────────────────────── */
  .chulapa-min-h-10 { min-height: 12rem; }
  @media (min-width: 576px) { .chulapa-min-h-10 { min-height: 10rem; } }

  /* ── Z-INDEX ─────────────────────────────────────────────────────────── */
  .stretched-link::after { z-index: 1; }
  .z-index-2 { z-index: 2; position: relative; }

  /* ── CARD BODY LAYOUT ────────────────────────────────────────────────── */
  .card-body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── DESKTOP (≥992px) ────────────────────────────────────────────────── */
  @media (min-width: 992px) {
    .card-col { aspect-ratio: 1 / 1; }

    .card {
      background-size: cover;
      background-position: center;
      background-image: var(--card-bg-image, linear-gradient(135deg, #2c3e50, #3498db));
    }
    .card::before {
      background: rgba(0,0,0,.55);
      z-index: 0;
    }
    .chulapa-card-img { display: none !important; }

    .card-body {
      position: relative; z-index: 1;
      color: #fff;
      background: transparent;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .card-body::-webkit-scrollbar       { width: 6px; }
    .card-body::-webkit-scrollbar-track { background: rgba(255,255,255,.2); border-radius: 10px; }
    .card-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.5); border-radius: 10px; }

    .card-title, .subtitle, .excerpt, .date { color: #fff !important; }
    .card-title a                           { color: #fff !important; }
    .subtitle                               { color: rgba(255,255,255,.8) !important; }
    .excerpt                                { color: rgba(255,255,255,.9) !important; }
    .border-top                             { border-top-color: rgba(255,255,255,.3) !important; }
    .categories-badges .badge,
    .tags-badges .badge                     { color: #fff !important; }

    .badge {
      display: inline-block;
      background-color: rgba(0,0,0,.6);
      backdrop-filter: blur(2px);
    }
    .chulapa-pill-bg-secondary { background-color: rgba(108,117,125,.8); }
    .chulapa-pill-bg-primary   { background-color: rgba(13,110,253,.8);  }
  }

  /* ── MOBILE / TABLET (<992px) ────────────────────────────────────────── */
  @media (max-width: 991.98px) {
    /* Suppress the CSS custom property on mobile so the gradient fallback
       doesn't bleed through on cards without a real image.                  */
    .card { background-image: none !important; }
    .card::before { display: none; }

    .card-body {
      color: inherit;
      background: inherit;
      border-radius: 0 0 0.75rem 0.75rem;
    }
    .card-title, .subtitle, .excerpt, .date, .badge { color: inherit !important; }
    .border-top { border-top-color: #dee2e6 !important; }
    .chulapa-card-img {
      display: block !important;
      border-radius: 0.75rem 0.75rem 0 0;
    }

    /* FIX #10: removed .row>[class*=col] margin-bottom overrides.
       Bootstrap's .g-4 (gap: 1.5rem) already provides correct gutters.
       These rules were double-spacing the grid on mobile.                   */
  }
</style>
